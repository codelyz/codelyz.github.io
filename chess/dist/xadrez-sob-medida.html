:root {
  --paper: #eef1f5;
  --sheet: #ffffff;
  --grid: #dfe5ec;
  --rule: #cdd5df;
  --ink: #1c2541;
  --ink-2: #4b5772;
  --ink-3: #78839a;
  --act: #1c2541;
  --act-ink: #ffffff;
  --mark: #ffdf5e;
  --mark-ink: #352b00;
  --mark-soft: #fff6cf;
  --both: #1b9460;
  --move: #2a70c4;
  --capture: #cf3f36;
  --danger: #c0392f;
  --ok: #1b8455;
  --focus: #2a70c4;
  --sq-l: #e9eef5;
  --sq-d: #93a6c1;
  --co-l: #66768f;
  --co-d: #f4f7fb;
  --sel: rgba(255, 214, 64, 0.72);
  --last: rgba(255, 214, 64, 0.42);
  --pw-fill: #fbfaf6;
  --pw-line: #1d2233;
  --pb-fill: #2a2e38;
  --pb-line: #0d0f14;
  --pb-det: #e9e6dc;
  --font-display: 'XSM Escolar', 'TeX Gyre Schola', 'Century Schoolbook', 'New Century Schoolbook', 'C059', Georgia, serif;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --r-sheet: 12px;
  --r-btn: 8px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b2624;
    --sheet: #22302d;
    --grid: #263532;
    --rule: #364742;
    --ink: #e9efe7;
    --ink-2: #b0bfb6;
    --ink-3: #85978d;
    --act: #e9efe7;
    --act-ink: #1b2624;
    --mark: #f1d15a;
    --mark-ink: #2a2200;
    --mark-soft: #393722;
    --both: #6ad197;
    --move: #82baf2;
    --capture: #f2887d;
    --danger: #f08a7f;
    --ok: #6ad197;
    --focus: #82baf2;
    --sq-l: #b8c6bc;
    --sq-d: #6a8175;
    --co-l: #4b5e54;
    --co-d: #e8f0ea;
    --pw-fill: #fbfaf6;
    --pw-line: #141820;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b2624;
  --sheet: #22302d;
  --grid: #263532;
  --rule: #364742;
  --ink: #e9efe7;
  --ink-2: #b0bfb6;
  --ink-3: #85978d;
  --act: #e9efe7;
  --act-ink: #1b2624;
  --mark: #f1d15a;
  --mark-ink: #2a2200;
  --mark-soft: #393722;
  --both: #6ad197;
  --move: #82baf2;
  --capture: #f2887d;
  --danger: #f08a7f;
  --ok: #6ad197;
  --focus: #82baf2;
  --sq-l: #b8c6bc;
  --sq-d: #6a8175;
  --co-l: #4b5e54;
  --co-d: #e8f0ea;
  --pw-fill: #fbfaf6;
  --pw-line: #141820;
  color-scheme: dark;
}

/* cores do tabuleiro escolhidas nos ajustes */
:root[data-board="madeira"] { --sq-l: #efd9b6; --sq-d: #b4875f; --co-l: #8a6443; --co-d: #f6e7cf; }
:root[data-board="verde"] { --sq-l: #ecedd1; --sq-d: #769656; --co-l: #5d7a43; --co-d: #f1f2df; }
:root[data-board="marmore"] { --sq-l: #e9e7e2; --sq-d: #a7a297; --co-l: #7c776d; --co-d: #f5f3ef; }

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  font: 16px/1.5 var(--font-ui);
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
p { margin: 0 0 0.6em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 12px; top: 12px; z-index: 200; background: var(--sheet); padding: 8px 12px; border-radius: 8px; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; }

/* ---------------------------------------------------------------- tipografia */
.h-display {
  font: 700 clamp(1.9rem, 4.6vw, 2.9rem)/1.08 var(--font-display);
  letter-spacing: -0.01em;
  margin: 0;
  max-width: 17ch;
  text-wrap: balance;
}
.h-title { font: 700 clamp(1.35rem, 3vw, 1.8rem)/1.15 var(--font-display); margin: 0 0 4px; text-wrap: balance; }
.h-sec2 { font: 700 1.35rem/1.25 var(--font-display); margin: 0 0 12px; }
.h-sec { font: 700 1.1rem/1.3 var(--font-display); margin: 0 0 10px; }
.lead { font-size: 1.06rem; color: var(--ink-2); max-width: 60ch; margin: 12px 0 0; }
.muted { color: var(--ink-2); font-size: 0.92rem; }
.empty-note { color: var(--ink-2); font: italic 1.02rem/1.5 var(--font-display); }

/* ---------------------------------------------------------------- estrutura */
.top {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--paper) 94%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo { width: 32px; height: 32px; flex: none; }
.logo-bg { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.logo-grid { stroke: var(--rule); stroke-width: 0.6; fill: none; }
.logo-dot { fill: var(--both); }
.logo-me { fill: var(--ink); }
.brand-t { font: 700 1.22rem/1 var(--font-display); white-space: nowrap; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav-b {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: none;
  background: none;
  padding: 8px 12px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink-2);
  cursor: pointer;
}
.nav-b .ic { width: 18px; height: 18px; }
.nav-b:hover { color: var(--ink); }
.nav-b.on { color: var(--ink); box-shadow: inset 0 -0.55em 0 var(--mark); border-radius: 2px; }
.nav-dot { position: absolute; top: 5px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--ink); }
.top-act { margin-left: auto; display: flex; gap: 2px; }
.bottom-nav { display: none; }
.main {
  max-width: 1240px;
  margin: 0 auto;
  padding: 22px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left));
}
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r-sheet); padding: 16px; }

@media (max-width: 760px) {
  .nav { display: none; }
  .bottom-nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    background: var(--sheet);
    border-top: 1px solid var(--rule);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav .nav-b { flex-direction: column; gap: 3px; font-size: 0.76rem; padding: 6px 4px; justify-content: center; }
  .bottom-nav .nav-b .ic { width: 22px; height: 22px; }
  .bottom-nav .nav-b.on { box-shadow: none; background: color-mix(in srgb, var(--mark) 60%, transparent); border-radius: 10px; }
  .bottom-nav .nav-dot { top: 4px; right: calc(50% - 20px); }
  .main { padding-bottom: calc(100px + env(safe-area-inset-bottom)); padding-top: 16px; }
  .ed-name { font-size: 1.3rem; }
  .brand-t { font-size: 1.08rem; }
}

/* ---------------------------------------------------------------- botões e campos */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45em;
  min-height: 40px;
  padding: 0 14px;
  border-radius: var(--r-btn);
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1;
  cursor: pointer;
  color: var(--ink);
  background: transparent;
  white-space: nowrap;
  text-decoration: none;
}
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--act); color: var(--act-ink); }
.btn-primary:hover { background: color-mix(in srgb, var(--act) 86%, var(--move)); }
.btn-ghost { border-color: var(--rule); background: var(--sheet); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-mark { background: var(--mark); color: var(--mark-ink); }
.btn-mark:hover { background: color-mix(in srgb, var(--mark) 85%, #000); }
.btn-chip { border: 1px dashed var(--ink-3); border-radius: 999px; min-height: 32px; padding: 0 12px; font-size: 0.86rem; }
.btn-chip:hover { border-style: solid; background: var(--sheet); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger-ghost { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); background: transparent; }
.btn-sm { min-height: 34px; padding: 0 11px; font-size: 0.87rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.icon-btn {
  width: 38px;
  height: 38px;
  display: inline-grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  flex: none;
}
.icon-btn:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink); }

.inp {
  font-size: 1rem;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--rule);
  background: var(--sheet);
  color: var(--ink);
  min-height: 40px;
  width: 100%;
}
.inp-letter { width: 58px; text-align: center; font: 700 1.15rem var(--font-display); text-transform: uppercase; }
.inp-num { width: 112px; }
.inp-tag { width: 128px; min-height: 30px; padding: 3px 8px; font-size: 0.9rem; }
.sel {
  font-size: 0.95rem;
  padding: 7px 30px 7px 10px;
  border-radius: 8px;
  border: 1px solid var(--rule);
  background-color: var(--sheet);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  color: var(--ink);
  min-height: 40px;
  appearance: none;
  max-width: 100%;
}
.sel-sm { min-height: 32px; padding: 3px 26px 3px 8px; font-size: 0.88rem; }
.sel-add { border-style: dashed; color: var(--ink-2); }
.field { display: grid; gap: 4px; flex: 1 1 160px; }
.field-xs { flex: 0 0 auto; }
.field-sm { flex: 0 1 180px; }
.field label, .field-label { font-weight: 600; font-size: 0.82rem; color: var(--ink-2); }
.field-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.field-block { display: grid; gap: 6px; margin-bottom: 14px; justify-items: start; }
.mini-check { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink-2); cursor: pointer; }
.mini-check input { width: 16px; height: 16px; accent-color: var(--both); }

.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px 3px 7px; border-radius: 999px; font-weight: 600; font-size: 0.78rem; white-space: nowrap; }
.pill .ic { width: 14px; height: 14px; }
.pill-warn { background: var(--mark); color: var(--mark-ink); }
.pill-ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 10px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg-b {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  border-radius: 8px;
  padding: 7px 11px;
  font-weight: 600;
  font-size: 0.88rem;
  color: var(--ink-2);
  cursor: pointer;
  min-height: 36px;
}
.seg-b .ic { width: 16px; height: 16px; }
.seg-b.on { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule), 0 1px 2px rgba(0, 0, 0, 0.08); }
.seg-sm .seg-b { padding: 5px 9px; min-height: 32px; font-size: 0.84rem; }

.tg { display: flex; align-items: flex-start; gap: 12px; }
.tg-in {
  appearance: none;
  width: 42px;
  height: 24px;
  border-radius: 999px;
  background: var(--rule);
  position: relative;
  flex: none;
  cursor: pointer;
  margin: 1px 0 0;
  transition: background 0.15s;
}
.tg-in::after { content: ''; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.tg-in:checked { background: var(--both); }
.tg-in:checked::after { transform: translateX(18px); }
.tg-lb { display: grid; gap: 1px; cursor: pointer; }
.tg-t { font-weight: 600; }
.tg-h { font-size: 0.86rem; color: var(--ink-2); }

.pick { position: relative; }
.pick-sum {
  list-style: none;
  cursor: pointer;
  padding: 7px 30px 7px 12px;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background-color: var(--sheet);
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
  font-weight: 600;
  font-size: 0.92rem;
  min-height: 40px;
  display: flex;
  align-items: center;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pick-sum::-webkit-details-marker { display: none; }
.pick-list, .menu-list {
  position: absolute;
  z-index: 30;
  top: calc(100% + 4px);
  left: 0;
  min-width: 230px;
  background: var(--sheet);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 6px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
  display: grid;
  gap: 2px;
  max-height: 340px;
  overflow: auto;
}
.pick-opt { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 0.92rem; }
.pick-opt:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.pick-opt input { width: 16px; height: 16px; accent-color: var(--both); }
.pick-ic { width: 26px; height: 26px; display: inline-block; flex: none; }
.pick-ic .pc { width: 100%; height: 100%; display: block; }
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-list { left: auto; right: 0; }
.menu-it { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; border-radius: 6px; cursor: pointer; font-size: 0.93rem; color: var(--ink); }
.menu-it:hover { background: color-mix(in srgb, var(--ink) 7%, transparent); }
.menu-it .ic { width: 18px; height: 18px; color: var(--ink-2); }
.menu-it.danger, .menu-it.danger .ic { color: var(--danger); }

.tabs {
  display: flex;
  gap: 2px;
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  margin: 18px 0 14px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none;
  border: none;
  padding: 10px 12px 8px;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--ink-2);
  white-space: nowrap;
  cursor: pointer;
}
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); box-shadow: inset 0 -0.6em 0 var(--mark); }
.tabs-sm { margin: 4px 0 10px; }
.tabs-sm .tab { padding: 8px 10px 6px; font-size: 0.9rem; }

/* avisos de regras não baixadas */
.unsaved {
  display: flex;
  gap: 10px 16px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  background: var(--mark-soft);
  border: 1px solid var(--mark);
  border-left: 6px solid var(--mark);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 12px;
}
.unsaved p { margin: 0; flex: 1 1 280px; }
.problems { display: grid; gap: 8px; margin-top: 12px; }
.problems:empty { display: none; }
.prob { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--mark-soft); border: 1px solid var(--mark); }
.prob p { margin: 0; }
.prob-err { background: color-mix(in srgb, var(--danger) 12%, var(--sheet)); border-color: var(--danger); }

/* ---------------------------------------------------------------- tabuleiro */
.board-frame { position: relative; width: 100%; }
.board {
  position: relative;
  width: 100%;
  aspect-ratio: var(--bw) / var(--bh);
  margin: 0 auto;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
  border-radius: 2px;
  box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px color-mix(in srgb, var(--ink) 14%, transparent);
}
.board-play .board { width: min(100%, max(300px, calc((100dvh - 290px) * var(--bw) / var(--bh)))); }
.b-squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--bw), 1fr); grid-template-rows: repeat(var(--bh), 1fr); }
.sq { position: relative; }
.sq-l { background: var(--sq-l); }
.sq-d { background: var(--sq-d); }
.co { position: absolute; font-weight: 700; font-size: clamp(8px, 1.5vw, 11px); line-height: 1; pointer-events: none; z-index: 1; }
.co-f { right: 3px; bottom: 2px; }
.co-r { left: 3px; top: 3px; }
.sq-l .co { color: var(--co-l); }
.sq-d .co { color: var(--co-d); }
.sq::before, .sq::after { content: none; position: absolute; pointer-events: none; }
.sq.last::before { content: ''; inset: 0; background: var(--last); }
.sq.sel::before { content: ''; inset: 0; background: var(--sel); }
.sq.hint::before { content: ''; inset: 0; background: color-mix(in srgb, var(--both) 50%, transparent); }
.sq.chk::before { content: ''; inset: 0; background: radial-gradient(circle, rgba(226, 52, 40, 0.95) 0%, rgba(226, 52, 40, 0.5) 42%, transparent 72%); }
.sq.extra::before { content: ''; inset: 0; background: var(--mark); animation: pulse 1.3s ease-in-out infinite; }
.sq.tgt::after { content: ''; left: 50%; top: 50%; width: 30%; height: 30%; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(28, 37, 65, 0.38); z-index: 3; }
.sq.tgt-cap::after { content: ''; inset: 5%; border-radius: 50%; border: 5px solid rgba(28, 37, 65, 0.42); z-index: 3; }
.sq.goal { background-image: repeating-linear-gradient(45deg, transparent 0 7px, color-mix(in srgb, var(--mark) 70%, transparent) 7px 11px); box-shadow: inset 0 0 0 2px var(--mark); }
.b-pieces { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.pcw {
  position: absolute;
  left: 0;
  top: 0;
  width: calc(100% / var(--bw));
  height: calc(100% / var(--bh));
  transition: transform 0.2s ease;
  will-change: transform;
}
.pcw .pc { width: 100%; height: 100%; display: block; }
.pcw.drag { transition: none; z-index: 5; filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.28)); }
.pcw.drag .pc { transform: scale(1.12); }
.pcw.moving { z-index: 4; }
.pcw.leaving { opacity: 0; transition: opacity 0.22s, transform 0.2s; }
.pcw.appear { animation: appear 0.35s ease; }
.pcw.morph .pc { animation: morph 0.5s ease; }
.pcw.tagged::after { content: ''; position: absolute; right: 9%; top: 9%; width: 17%; height: 17%; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--pw-line); }
.pcw .pc-orig { position: absolute; left: 3%; bottom: 3%; width: 38%; height: 38%; border-radius: 50%; background: var(--mark); box-shadow: 0 0 0 2px var(--pw-line); padding: 2%; }
.pcw .pc-orig .pc { width: 100%; height: 100%; }
.b-fx { position: absolute; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
.fx-hit { position: absolute; animation: hit 1.1s ease-out forwards; }
.fx-hit::before, .fx-hit::after { content: ''; position: absolute; left: 50%; top: 50%; width: 70%; height: 12%; background: #e0362a; border-radius: 4px; box-shadow: 0 0 0 2px #fff; }
.fx-hit::before { transform: translate(-50%, -50%) rotate(45deg); }
.fx-hit::after { transform: translate(-50%, -50%) rotate(-45deg); }
@keyframes hit { 0% { opacity: 0; transform: scale(0.4); } 20% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
.fx-boom { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 226, 110, 0.95) 0%, rgba(255, 150, 60, 0.75) 35%, rgba(220, 60, 40, 0.3) 60%, transparent 72%); animation: boom 0.7s ease-out forwards; }
.fx-ping { position: absolute; border-radius: 50%; box-shadow: 0 0 0 4px var(--mark), 0 0 0 6px var(--pw-line); animation: ping 0.85s ease-out forwards; }

.pc .b { stroke-width: 3.2; stroke-linejoin: round; }
.pw .b { fill: var(--pw-fill); stroke: var(--pw-line); }
.pw .dl { fill: none; stroke: var(--pw-line); stroke-width: 3.2; stroke-linecap: round; }
.pw .df { fill: var(--pw-line); }
.pb .b { fill: var(--pb-fill); stroke: var(--pb-line); }
.pb .dl { fill: none; stroke: var(--pb-det); stroke-width: 3; stroke-linecap: round; }
.pb .df { fill: var(--pb-det); }
.pc .lt { font: 700 40px var(--font-display); }
.pw .lt { fill: var(--pw-line); }
.pb .lt { fill: var(--pb-det); }

@keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.8; } }
@keyframes appear { from { opacity: 0; transform: scale(0.6); } }
@keyframes morph { 0% { transform: scale(1); } 35% { transform: scale(0.55) rotate(-12deg); filter: brightness(1.6); } 100% { transform: scale(1); } }
@keyframes boom { from { transform: scale(0.25); opacity: 1; } to { transform: scale(1.15); opacity: 0; } }
@keyframes ping { from { transform: scale(0.45); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ---------------------------------------------------------------- biblioteca */
.lib-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px 32px; align-items: end; margin: 6px 0 30px; }
.lib-hero-act { display: flex; gap: 8px; flex-wrap: wrap; }
.lib-sec { margin-bottom: 30px; }
.lib-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 470px), 1fr)); gap: 12px; }
.lib-row { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 16px; align-items: start; }
.lib-row.is-dirty { border-color: var(--mark); box-shadow: inset 6px 0 0 var(--mark); padding-left: 20px; }
.mini {
  display: grid;
  grid-template-columns: repeat(var(--bw), 1fr);
  width: 116px;
  aspect-ratio: var(--bw) / var(--bh);
  border: 2px solid var(--ink);
  border-radius: 2px;
  overflow: hidden;
  align-self: start;
}
.mini i { display: block; aspect-ratio: 1; }
.mini .ml { background: var(--sq-l); }
.mini .md { background: var(--sq-d); }
.mini .pc { width: 100%; height: 100%; display: block; }
.mini .pc .b { stroke-width: 5; }
.lib-title-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lib-name { font: 700 1.16rem/1.2 var(--font-display); margin: 0; }
.lib-desc { margin: 5px 0 4px; color: var(--ink-2); font-size: 0.93rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lib-meta { margin: 0 0 10px; font-size: 0.8rem; color: var(--ink-3); }
.lib-act { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.drop-hint { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 0.88rem; }
.drop-hint .ic { width: 18px; height: 18px; }
body.dropping::after {
  content: 'Solte o arquivo de regras aqui';
  position: fixed;
  inset: 12px;
  border: 3px dashed var(--ink);
  border-radius: 16px;
  display: grid;
  place-items: center;
  font: 700 1.4rem var(--font-display);
  background: color-mix(in srgb, var(--mark) 40%, transparent);
  z-index: 300;
  pointer-events: none;
}
@media (max-width: 720px) {
  .lib-hero { grid-template-columns: 1fr; }
  .lib-row { grid-template-columns: 84px minmax(0, 1fr); gap: 12px; }
  .mini { width: 84px; }
}

/* ---------------------------------------------------------------- jogo */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.play-main { min-width: 0; }
.play-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.play-head .muted { margin: 0; }
.status { min-height: 3.1em; margin: 10px 0 14px; }
.status-main { font-weight: 600; font-size: 1.05rem; margin: 0; }
.status-main.thinking::before { content: ''; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 50%; background: var(--move); margin-right: 0.5em; animation: blink 0.9s infinite; vertical-align: 0.05em; }
.status-main.check { color: var(--danger); }
.status-news { margin: 2px 0 0; color: var(--ink-2); font: italic 1rem/1.4 var(--font-display); min-height: 1.4em; }
.board-play { display: grid; justify-items: center; padding: 3px 9px 9px 3px; }
.play-ctrl { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; justify-content: center; }
.play-side { position: sticky; top: 78px; max-height: calc(100dvh - 100px); display: flex; flex-direction: column; padding: 4px 16px 16px; }
.play-side .tabs { flex: none; }
.side-body { overflow: auto; min-height: 120px; padding-right: 2px; }
.over { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 50%, transparent); z-index: 8; border-radius: 2px; }
.over-card {
  background: var(--sheet);
  border: 2px solid var(--ink);
  border-radius: 14px;
  padding: 18px 22px;
  text-align: center;
  box-shadow: 6px 6px 0 color-mix(in srgb, var(--ink) 20%, transparent);
  max-width: 88%;
}
.over-title { font: 700 1.8rem/1.15 var(--font-display); margin: 0; }
.over-card.won .over-title { display: inline; box-shadow: inset 0 -0.42em 0 var(--mark); }
.over-sub { color: var(--ink-2); margin: 8px 0 14px; }
.over-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.moves { list-style: none; margin: 0; padding: 0; font: 0.98rem/1.5 var(--font-display); font-variant-numeric: tabular-nums; }
.moves li { display: grid; grid-template-columns: 2.4em 1fr 1fr; gap: 6px; padding: 3px 4px; border-bottom: 1px dotted var(--rule); }
.mv-n { color: var(--ink-3); }
.rule-lines { margin: 6px 0 16px; padding-left: 1.1em; font: 1rem/1.5 var(--font-display); }
.rule-lines li { margin: 4px 0; }
.rule-special li::marker { color: var(--both); }
.rule-desc { font: italic 1.03rem/1.5 var(--font-display); margin: 10px 0 14px; color: var(--ink-2); }
.legend-it { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.legend-it:last-child { border-bottom: none; }
.legend-h { display: flex; align-items: center; gap: 8px; font: 700 1.06rem/1.2 var(--font-display); margin: 0 0 8px; }
.legend-ic { width: 34px; height: 34px; display: inline-block; }
.legend-ic .pc { width: 100%; height: 100%; }
.legend-l { margin-left: auto; font-weight: 700; font-size: 0.8rem; color: var(--ink-3); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; font-family: var(--font-display); }
.legend-dg { display: flex; gap: 12px; flex-wrap: wrap; }
.legend-fig { margin: 0; }
.legend-fig figcaption { font-size: 0.78rem; color: var(--ink-2); text-align: center; margin-top: 4px; }
.play-empty { max-width: 720px; }
.promo-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.promo-pick { display: grid; justify-items: center; gap: 4px; width: 96px; padding: 8px; border: 1px solid var(--rule); border-radius: 10px; background: var(--sq-l); cursor: pointer; color: #1c2541; font-weight: 600; font-size: 0.86rem; }
.promo-pick .pc { width: 64px; height: 64px; }
.promo-pick:hover { box-shadow: 0 0 0 3px var(--mark); }
@media (max-width: 920px) {
  .play { grid-template-columns: 1fr; }
  .play-side { position: static; max-height: none; }
}

/* ---------------------------------------------------------------- grade de movimentos */
.mg { position: relative; aspect-ratio: 1; }
.mg-lg { width: min(100%, 370px); }
.mg-sm { width: 128px; }
.mg-grid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  grid-template-rows: repeat(9, 1fr);
  border: 2px solid var(--ink);
  border-radius: 3px;
  overflow: hidden;
  background: var(--rule);
  gap: 1px;
}
.mg-c { position: relative; border: 0; padding: 0; margin: 0; background: var(--sheet); display: grid; place-items: center; min-width: 0; }
.mg-d { background: color-mix(in srgb, var(--sq-d) 22%, var(--sheet)); }
button.mg-c { cursor: pointer; }
button.mg-c:hover { background: color-mix(in srgb, var(--mark) 40%, var(--sheet)); }
.mg-me { background: var(--mark) !important; }
.mg-me .pc { width: 94%; height: 94%; }
.mg-c i { display: block; width: 44%; height: 44%; border-radius: 50%; position: relative; z-index: 2; }
.mk-ride i { width: 30%; height: 30%; }
.mk-both i { background: var(--both); }
.mk-move i { background: var(--sheet); box-shadow: inset 0 0 0 3px var(--move); }
.mg-sm .mk-move i { box-shadow: inset 0 0 0 2px var(--move); }
.mk-capture i { background: var(--capture); border-radius: 2px; transform: rotate(45deg) scale(0.86); }
.mk-ghost i { opacity: 0.32; }
.mk-hop i { outline: 2px dashed var(--ink-3); outline-offset: 2px; }
.mg-lines { position: absolute; inset: 2px; pointer-events: none; z-index: 1; }
.mg-lines svg { width: 100%; height: 100%; display: block; }
.mg-lines line { stroke-width: 0.08; stroke-linecap: round; opacity: 0.7; }
.ln-both line { stroke: var(--both); }
.ln-move line { stroke: var(--move); }
.ln-capture line { stroke: var(--capture); }
.ln-hop line { stroke-dasharray: 0.16 0.12; }
.ln-both .mg-arrow { fill: var(--both); }
.ln-move .mg-arrow { fill: var(--move); }
.ln-capture .mg-arrow { fill: var(--capture); }
.mg-sm .mg-lines line { stroke-width: 0.12; }
.mg-note { margin: 0; font-size: 0.82rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; text-align: center; }
.lg { display: inline-flex; align-items: center; gap: 5px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.sw-both { background: var(--both); }
.sw-move { box-shadow: inset 0 0 0 3px var(--move); }
.sw-capture { background: var(--capture); transform: rotate(45deg) scale(0.82); border-radius: 2px; }
.mg-sum { font: italic 1.02rem/1.4 var(--font-display); margin: 2px 0 0; text-align: center; }
.mg-tools { display: grid; gap: 14px; }
.mg-tool-group { display: grid; gap: 6px; justify-items: start; }
.mg-tool-lb { font-weight: 600; font-size: 0.8rem; color: var(--ink-2); }
.mg-hoprow { display: flex; gap: 8px; align-items: flex-start; font-size: 0.88rem; color: var(--ink-2); }
.mg-hoprow input { width: 16px; height: 16px; margin-top: 2px; accent-color: var(--both); }
.tpl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 14px; }
.tpl .mg-tool-lb { width: 100%; }
.tpl-l { font-size: 0.9rem; }

/* ---------------------------------------------------------------- editor */
.ed-head { display: grid; gap: 10px; }
.ed-head-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ed-name {
  flex: 1 1 260px;
  min-width: 0;
  font: 700 clamp(1.4rem, 3.4vw, 2rem)/1.15 var(--font-display);
  border: none;
  border-bottom: 2px dashed transparent;
  background: transparent;
  color: var(--ink);
  padding: 2px 0;
  border-radius: 0;
}
.ed-name:hover, .ed-name:focus { border-bottom-color: var(--ink-3); outline: none; }
.ed-desc {
  font: italic 1.02rem/1.5 var(--font-display);

    out.self = e.self !== false;
    out.sparePawns = e.sparePawns !== false;
    out.spareRoyal = !!e.spareRoyal;
    if (e.targets === 'enemy' || e.targets === 'own') out.targets = e.targets;
  }
  if (out.type === 'addTag' || out.type === 'removeTag') out.tag = tagName(e.tag) || 'marca';
  return out;
}

function normalizeTrigger(t) {
  const tr = t || {};
  return {
    event: oneOf(tr.event, EVENT_LIST, 'capture'),
    pieces: idList(tr.pieces),
    targets: idList(tr.targets),
    conditions: (Array.isArray(tr.conditions) ? tr.conditions : []).map(normalizeCondition),
    effects: (Array.isArray(tr.effects) ? tr.effects : []).map(normalizeEffect),
    enabled: tr.enabled !== false,
  };
}

function normalizeGoal(g) {
  if (!g || !g.mode) return null;
  const mode = oneOf(g.mode, ['squares', 'lastRank'], null);
  if (!mode) return null;
  const squares = Array.isArray(g.squares) ? g.squares.map((s) => String(s).toLowerCase()).filter((s) => /^[a-l](1[0-2]|[1-9])$/.test(s)) : [];
  return { mode, pieces: idList(g.pieces), squares };
}

function normalizeRules(raw) {
  const r = JSON.parse(JSON.stringify(raw || {}));
  const W = clampInt(r.board && r.board.width, MIN_SIZE, MAX_SIZE, 8);
  const H = clampInt(r.board && r.board.height, MIN_SIZE, MAX_SIZE, 8);
  const v = r.victory || {};
  const o = r.options || {};
  return {
    format: FORMAT,
    version: FORMAT_VERSION,
    name: String(r.name || 'Variante sem nome').slice(0, 60),
    description: String(r.description || '').slice(0, 600),
    board: { width: W, height: H },
    pieces: (Array.isArray(r.pieces) ? r.pieces : []).slice(0, 40).map(normalizePiece),
    setup: typeof r.setup === 'string' && r.setup.trim() ? r.setup.trim() : emptySetup(W, H),
    victory: {
      royal: oneOf(v.royal, ['checkmate', 'capture', 'none'], 'checkmate'),
      stalemate: oneOf(v.stalemate, ['draw', 'loss', 'win'], 'draw'),
      extinction: oneOf(v.extinction, ['off', 'loss', 'win'], 'off'),
      goal: normalizeGoal(v.goal),
    },
    options: {
      castling: o.castling !== false,
      enPassant: o.enPassant !== false,
      forcedCapture: !!o.forcedCapture,
      fiftyMove: clampInt(o.fiftyMove, 0, 200, 50),
      repetition: clampInt(o.repetition, 0, 10, 3),
    },
    triggers: (Array.isArray(r.triggers) ? r.triggers : []).slice(0, 30).map(normalizeTrigger),
  };
}

// ---------------------------------------------------------------------------
// Posição inicial (formato tipo FEN: maiúsculas = brancas, minúsculas = pretas)
// ---------------------------------------------------------------------------

function parseSetup(setup, W, H, idx) {
  const rows = String(setup).trim().split('/');
  if (rows.length !== H) throw new RuleError(`A posição inicial tem ${rows.length} fileiras, mas o tabuleiro tem ${H}.`);
  const b = new Uint8Array(W * H);
  for (let r = 0; r < H; r++) {
    const y = H - 1 - r;
    const row = rows[r];
    let x = 0;
    for (let i = 0; i < row.length; ) {
      const ch = row[i];
      if (ch >= '0' && ch <= '9') {
        let j = i;
        while (j < row.length && row[j] >= '0' && row[j] <= '9') j++;
        x += parseInt(row.slice(i, j), 10);
        i = j;
        continue;
      }
      const up = ch.toUpperCase();
      const t = idx.get(up);
      if (t === undefined) throw new RuleError(`A posição inicial usa a letra "${ch}", mas nenhuma peça tem essa letra.`);
      if (x >= W) throw new RuleError(`A fileira ${y + 1} da posição inicial tem casas demais.`);
      b[y * W + x] = mk(t, ch === up ? 0 : 1, 0);
      x++;
      i++;
    }
    if (x !== W) throw new RuleError(`A fileira ${y + 1} da posição inicial tem ${x} casas, mas deveria ter ${W}.`);
  }
  return b;
}

// cells: array W*H com null ou {id, color}
function setupToCells(setup, W, H) {
  const cells = new Array(W * H).fill(null);
  const rows = String(setup || '').trim().split('/');
  for (let r = 0; r < Math.min(rows.length, H); r++) {
    const y = H - 1 - r;
    const row = rows[r];
    let x = 0;
    for (let i = 0; i < row.length && x < W; ) {
      const ch = row[i];
      if (ch >= '0' && ch <= '9') {
        let j = i;
        while (j < row.length && row[j] >= '0' && row[j] <= '9') j++;
        x += parseInt(row.slice(i, j), 10);
        i = j;
        continue;
      }
      const up = ch.toUpperCase();
      if (/[A-Z]/.test(up)) cells[y * W + x] = { id: up, color: ch === up ? 0 : 1 };
      x++;
      i++;
    }
  }
  return cells;
}

function cellsToSetup(cells, W, H) {
  const rows = [];
  for (let y = H - 1; y >= 0; y--) {
    let row = '';
    let empty = 0;
    for (let x = 0; x < W; x++) {
      const c = cells[y * W + x];
      if (!c) {
        empty++;
        continue;
      }
      if (empty) row += empty;
      empty = 0;
      row += c.color ? c.id.toLowerCase() : c.id.toUpperCase();
    }
    if (empty) row += empty;
    rows.push(row);
  }
  return rows.join('/');
}

const squareName = (G, sq) => FILES[sq % G.W] + (Math.floor(sq / G.W) + 1);
function parseSquare(name, W, H) {
  const m = /^([a-l])(1[0-2]|[1-9])$/.exec(String(name).toLowerCase());
  if (!m) return -1;
  const x = FILES.indexOf(m[1]);
  const y = parseInt(m[2], 10) - 1;
  if (x >= W || y >= H) return -1;
  return y * W + x;
}

// ---------------------------------------------------------------------------
// Compilação
// ---------------------------------------------------------------------------

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return (t ^ (t >>> 14)) >>> 0;
  };
}

const MODE_BITS = { both: 3, move: MOVE, capture: CAP };

function compileRules(raw) {
  const r = normalizeRules(raw);
  const W = r.board.width;
  const H = r.board.height;
  const N = W * H;
  if (!r.pieces.length) throw new RuleError('Crie pelo menos uma peça.');

  const idx = new Map();
  r.pieces.forEach((p) => {
    if (!/^[A-Z]$/.test(p.id)) throw new RuleError(`A peça "${p.name}" precisa de uma letra de A a Z.`);
    if (idx.has(p.id)) throw new RuleError(`Duas peças usam a letra ${p.id}. Cada peça precisa de uma letra diferente.`);
    idx.set(p.id, idx.size);
  });

  const tags = [];
  const tagBit = (name) => {
    const n = tagName(name);
    if (!n) return 0;
    let i = tags.indexOf(n);
    if (i < 0) {
      if (tags.length >= 30) throw new RuleError('Use no máximo 30 marcas diferentes.');
      tags.push(n);
      i = tags.length - 1;
    }
    return 1 << i;
  };
  const typeOf = (id, where) => {
    const i = idx.get(String(id || '').toUpperCase());
    if (i === undefined) throw new RuleError(`${where}: escolha uma peça que exista.`);
    return i;
  };
  const maskOf = (ids) => {
    if (!ids || !ids.length) return null;
    const m = new Uint8Array(r.pieces.length);
    ids.forEach((id) => {
      const i = idx.get(id);
      if (i !== undefined) m[i] = 1;
    });
    return m;
  };

  let anyFirstMoveTrigger = false;
  let usesTransform = r.pieces.some((p) => p.moves.some((s) => s.when === 'transformed'));

  const types = r.pieces.map((p) => {
    const sets = p.moves.map((s) => ({
      cond: WHEN_CODE[s.when],
      replace: !!s.replace,
      arg: s.when === 'hasTag' || s.when === 'noTag' ? tagBit(s.tag) : s.when === 'nearFriend' ? (s.piece ? (idx.has(s.piece) ? idx.get(s.piece) : -2) : -1) : s.when === 'minRank' ? s.rank : 0,
      steps: s.steps.map((st) => ({
        dx: st.dx,
        dy: st.dy,
        ride: st.kind === 'ride',
        range: st.kind === 'ride' ? st.range || 0 : 1,
        mode: MODE_BITS[st.mode],
        hop: !!st.hop,
      })),
    }));
    return {
      id: p.id,
      name: p.name,
      icon: p.icon,
      royal: !!p.royal,
      pawn: !!p.pawn,
      castling: !!p.castling,
      castleRook: !!p.castleRook,
      promoTo: p.promotion ? p.promotion.to.map((id) => idx.get(id)).filter((x) => x !== undefined) : [],
      promoZone: p.promotion ? p.promotion.zone : 1,
      sets,
      hasCond: sets.some((s) => s.cond !== 0),
      hasReplace: sets.some((s) => s.replace),
      value: 0,
      autoValue: 0,
      userValue: p.value,
    };
  });

  types.forEach((T) => {
    T.autoValue = autoValue(T, W, H);
    T.value = T.userValue === null ? T.autoValue : T.userValue;
  });

  const triggers = r.triggers
    .filter((t) => t.enabled && t.effects.length)
    .map((t, ti) => {
      const where = `Regra especial ${ti + 1}`;
      return {
        event: t.event === 'capture' ? 0 : t.event === 'quiet' ? 1 : 2,
        pieceMask: maskOf(t.pieces),
        targetMask: t.event === 'capture' ? maskOf(t.targets) : null,
        conds: t.conditions.map((c) => {
          if (c.type === 'firstMove') anyFirstMoveTrigger = true;
          if (c.type === 'transformed' || c.type === 'notTransformed') usesTransform = true;
          return { type: c.type, bit: c.tag ? tagBit(c.tag) : 0, rank: c.rank || 0 };
        }),
        effects: t.effects.map((e) => {
          const out = { ...e };
          if (e.type === 'become' || e.type === 'leaveBehind') out.t = typeOf(e.piece, where);
          if (e.type === 'addTag' || e.type === 'removeTag') out.bit = tagBit(e.tag);
          if (e.type === 'extraMove') out.cap = e.capture === 'only' ? 1 : e.capture === 'none' ? 2 : 0;
          if (e.type === 'become' || e.type === 'becomeCaptured' || e.type === 'revert') usesTransform = true;
          out.backCode = e.back === 'endTurn' ? 1 : e.back === 'nextMove' ? 2 : e.back === 'turns' ? 3 : 0;
          out.side = e.targets === 'enemy' ? 1 : e.targets === 'own' ? 2 : 0;
          return out;
        }),
      };
    });

  const setupBoard = parseSetup(r.setup, W, H, idx);
  const hasRoyal = [false, false];
  for (let sq = 0; sq < N; sq++) {
    const c = setupBoard[sq];
    if (c && types[pType(c)].royal) hasRoyal[pColor(c)] = true;
  }

  const royalMode = r.victory.royal === 'none' || !types.some((T) => T.royal) ? 0 : r.victory.royal === 'checkmate' ? 1 : 2;

  let goal = null;
  if (r.victory.goal) {
    const g = r.victory.goal;
    const mask = new Uint8Array(N);
    let count = 0;
    if (g.mode === 'squares') {
      g.squares.forEach((s) => {
        const sq = parseSquare(s, W, H);
        if (sq >= 0) {
          mask[sq] = 1;
          count++;
        }
      });
    }
    if (g.mode === 'lastRank' || count) goal = { lastRank: g.mode === 'lastRank', mask, pieces: maskOf(g.pieces) };
  }

  const X = new Int8Array(N);
  const Y = new Int8Array(N);
  for (let sq = 0; sq < N; sq++) {
    X[sq] = sq % W;
    Y[sq] = Math.floor(sq / W);
  }

  const rnd = mulberry32(0x5eed1234 ^ (N * 7919));
  const Z1 = new Int32Array(N * 256);
  const Z2 = new Int32Array(N * 256);
  for (let i = 0; i < Z1.length; i++) {
    Z1[i] = rnd();
    Z2[i] = rnd();
  }

  const movedMatters = new Uint8Array(types.length);
  types.forEach((T, i) => {
    movedMatters[i] = T.castling || T.castleRook || anyFirstMoveTrigger || T.sets.some((s) => s.cond === 1 || s.cond === 2) ? 1 : 0;
  });

  const evalValue = new Int32Array(types.length);
  types.forEach((T, i) => {
    if (T.royal && royalMode === 1) evalValue[i] = 0;
    else if (T.royal && royalMode === 2) evalValue[i] = 4000;
    else evalValue[i] = T.value || T.autoValue;
  });

  return {
    rules: r,
    W,
    H,
    N,
    X,
    Y,
    types,
    idx,
    tags,
    royalMode,
    stalemate: r.victory.stalemate,
    extinction: r.victory.extinction,
    goal,
    castling: r.options.castling,
    enPassant: r.options.enPassant,
    forcedCapture: r.options.forcedCapture,
    fifty: r.options.fiftyMove,
    repetition: r.options.repetition,
    triggers,
    usesTags: tags.length > 0,
    usesTransform,
    hasRoyal,
    setupBoard,
    Z1,
    Z2,
    movedMatters,
    evalValue,
  };
}

// Valor estimado de uma peça escrita no formato das regras (usado pelo editor)
function pieceAutoValue(piece, W, H) {
  const np = normalizePiece(piece, 0);
  const T = {
    sets: np.moves.map((s) => ({
      cond: WHEN_CODE[s.when],
      steps: s.steps.map((st) => ({ dx: st.dx, dy: st.dy, ride: st.kind === 'ride', range: st.kind === 'ride' ? st.range || 0 : 1, mode: MODE_BITS[st.mode], hop: !!st.hop })),
    })),
  };
  return autoValue(T, W, H);
}

// Valor estimado de uma peça: média de casas alcançáveis num tabuleiro com
// 30% das casas ocupadas (peças que deslizam são bloqueadas com frequência).
function autoValue(T, W, H) {
  const P_FREE = 0.7;
  let total = 0;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let sum = 0;
      for (const set of T.sets) {
        const w = set.cond === 0 ? 1 : set.cond === 1 ? 0.15 : 0.5;
        for (const st of set.steps) {
          const mw = st.mode === 3 ? 1 : st.mode === MOVE ? 0.6 : 0.4;
          let tx = x + st.dx;
          let ty = y + st.dy;
          if (!st.ride) {
            if (tx >= 0 && tx < W && ty >= 0 && ty < H) sum += w * mw;
            continue;
          }
          let k = 1;
          let p = 1;
          const lim = st.range || 99;
          while (k <= lim && tx >= 0 && tx < W && ty >= 0 && ty < H) {
            sum += w * mw * p * (st.hop ? 0.35 : 1);
            p *= P_FREE;
            tx += st.dx;
            ty += st.dy;
            k++;
          }
        }
      }
      total += sum;
    }
  }
  const mob = total / (W * H);
  return Math.max(10, Math.round((50 + 50 * mob) / 5) * 5);
}

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------

function initialState(G) {
  const S = {
    b: G.setupBoard.slice(),
    tg: new Int32Array(G.N),
    tf: new Int32Array(G.N),
    turn: 0,
    ep: -1,
    epV: -1,
    ex: null,
    half: 0,
    ply: 0,
    res: null,
    hash: 0,
    ev: null,
  };
  S.hash = computeHash(G, S);
  return S;
}

function cloneState(G, S) {
  return {
    b: S.b.slice(),
    tg: G.usesTags ? S.tg.slice() : S.tg,
    tf: G.usesTransform ? S.tf.slice() : S.tf,
    turn: S.turn,
    ep: S.ep,
    epV: S.epV,
    ex: S.ex,
    half: S.half,
    ply: S.ply,
    res: S.res,
    hash: S.hash,
    ev: null,
  };
}

function serializeState(S) {
  return { b: Array.from(S.b), tg: Array.from(S.tg), tf: Array.from(S.tf), turn: S.turn, ep: S.ep, epV: S.epV, ex: S.ex, half: S.half, ply: S.ply, res: S.res, hash: S.hash };
}

function deserializeState(o) {
  return {
    b: Uint8Array.from(o.b),
    tg: Int32Array.from(o.tg),
    tf: o.tf ? Int32Array.from(o.tf) : new Int32Array(o.b.length),
    turn: o.turn,
    ep: o.ep,
    epV: o.epV,
    ex: o.ex || null,
    half: o.half,
    ply: o.ply,
    res: o.res || null,
    hash: o.hash,
    ev: null,
  };
}

function computeHash(G, S) {
  const b = S.b;
  const tg = S.tg;
  const Z1 = G.Z1;
  const Z2 = G.Z2;
  let h1 = S.turn ? 0x2545f491 : 0;
  let h2 = S.turn ? 0x4f6cdd1d : 0;
  for (let sq = 0, base = 0; sq < G.N; sq++, base += 256) {
    let c = b[sq];
    if (!c) continue;
    if (!G.movedMatters[(c & 63) - 1]) c &= ~MOVED;
    h1 ^= Z1[base + c];
    h2 ^= Z2[base + c];
    const f = S.tf[sq];
    if (f) {
      h1 ^= Math.imul(f + sq * 0x51ed, 0x9e3779b1);
      h2 ^= Math.imul(f ^ (sq * 0x2c1b), 0x7feb352d);
    }
    const t = tg[sq];
    if (t) {
      h1 ^= Math.imul(t + sq * 0x9e37, 0x85ebca6b);
      h2 ^= Math.imul(t ^ (sq * 0x7f4a), 0xc2b2ae35);
    }
  }
  if (S.ep >= 0) {
    h1 ^= Z1[S.ep * 256];
    h2 ^= Z2[S.ep * 256];
  }
  if (S.ex) {
    const k = (S.ex.sq + 2) * 16 + S.ex.cap * 4 + (S.ex.same ? 2 : 0) + (S.ex.optional ? 1 : 0);
    h1 ^= Math.imul(k, 0x27d4eb2d) ^ 0x3c6ef372;
    h2 ^= Math.imul(k, 0x165667b1) ^ 0x1b873593;
  }
  return (h1 >>> 0) * 2097152 + ((h2 >>> 0) & 0x1fffff);
}

// ---------------------------------------------------------------------------
// Geração de lances
// ---------------------------------------------------------------------------

const relRank = (G, sq, c) => (c === 0 ? G.Y[sq] + 1 : G.H - G.Y[sq]);

function setActive(G, S, set, sq, c, code, inExtra) {
  switch (set.cond) {
    case 0:
      return true;
    case 1:
      return !(code & MOVED);
    case 2:
      return !!(code & MOVED);
    case 3:
      return relRank(G, sq, c) > Math.ceil(G.H / 2);
    case 4:
      return relRank(G, sq, c) <= Math.floor(G.H / 2);
    case 5:
      return (S.tg[sq] & set.arg) !== 0;
    case 6:
      return (S.tg[sq] & set.arg) === 0;
    case 7:
      return inExtra;
    case 8: {
      if (set.arg === -2) return false;
      const x = G.X[sq];
      const y = G.Y[sq];
      for (let dy = -1; dy <= 1; dy++) {
        const ty = y + dy;
        if (ty < 0 || ty >= G.H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const tx = x + dx;
          if (tx < 0 || tx >= G.W) continue;
          const o = S.b[ty * G.W + tx];
          if (o && ((o >> 6) & 1) === c && (set.arg < 0 || (o & 63) - 1 === set.arg)) return true;
        }
      }
      return false;
    }
    case 9:
      return relRank(G, sq, c) >= set.arg;
    case 10:
      return S.tf[sq] !== 0;
    default:
      return false;
  }
}

function usesReplace(G, S, T, sq, c, code, inExtra) {
  if (!T.hasReplace) return false;
  for (const set of T.sets) if (set.replace && setActive(G, S, set, sq, c, code, inExtra)) return true;
  return false;
}

// Marcador para não repetir o mesmo destino quando dois movimentos levam à mesma casa
const SEEN = new Int32Array(256);
let seenStamp = 0;

// Gera os lances de uma peça. capOnly: só capturas (e promoções).
function genPiece(G, S, sq, out, capOnly, inExtra) {
  const b = S.b;
  const code = b[sq];
  const t = (code & 63) - 1;
  const c = (code >> 6) & 1;
  const T = G.types[t];
  const W = G.W;
  const H = G.H;
  const x = G.X[sq];
  const y = G.Y[sq];
  const sgn = c ? -1 : 1;
  const rep = usesReplace(G, S, T, sq, c, code, inExtra);
  const canEp = G.enPassant && T.pawn && S.ep >= 0 && S.epV >= 0 && b[S.epV] && ((b[S.epV] >> 6) & 1) !== c;
  const promo = T.promoTo.length > 0;
  const promoLimit = H - T.promoZone;
  // No modo xeque-mate o Rei nunca é capturado (nem num lance extra depois de um xeque)
  const noRoyalCap = G.royalMode === 1;
  if (++seenStamp > 2000000000) {
    SEEN.fill(0);
    seenStamp = 1;
  }
  const stamp = seenStamp;

  const push = (to, flag) => {
    if (SEEN[to] === stamp) return;
    SEEN[to] = stamp;
    if (promo && relRank(G, to, c) > promoLimit) {
      for (const p of T.promoTo) out.push(sq | (to << 8) | ((p + 1) << 16) | (flag << 22));
    } else {
      out.push(sq | (to << 8) | (flag << 22));
    }
  };
  const pushQuiet = (to) => {
    if (!capOnly) push(to, 0);
    else if (promo && relRank(G, to, c) > promoLimit) push(to, 0);
  };

  for (const set of T.sets) {
    if (rep && !set.replace) continue;
    if (set.cond !== 0 && !setActive(G, S, set, sq, c, code, inExtra)) continue;
    for (const st of set.steps) {
      const dx = st.dx * sgn;
      const dy = st.dy * sgn;
      let tx = x + dx;
      let ty = y + dy;
      if (!st.ride) {
        if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
        const to = ty * W + tx;
        const occ = b[to];
        if (occ === 0) {
          if (st.mode & MOVE) pushQuiet(to);
          else if (canEp && to === S.ep && st.mode & CAP) push(to, F_EP);
        } else if (((occ >> 6) & 1) !== c && st.mode & CAP && !(noRoyalCap && G.types[(occ & 63) - 1].royal)) push(to, 0);
        continue;
      }
      const lim = st.range || 99;
      let k = 1;
      let screened = false;
      while (k <= lim && tx >= 0 && tx < W && ty >= 0 && ty < H) {
        const to = ty * W + tx;
        const occ = b[to];
        if (occ === 0) {
          if (!st.hop || screened) {
            if (st.mode & MOVE) pushQuiet(to);
            else if (canEp && to === S.ep && st.mode & CAP) push(to, F_EP);
          }
        } else if (st.hop && !screened) {
          screened = true;
        } else {
          if (((occ >> 6) & 1) !== c && st.mode & CAP && !(noRoyalCap && G.types[(occ & 63) - 1].royal)) push(to, 0);
          break;
        }
        tx += dx;
        ty += dy;
        k++;
      }
    }
  }

  if (!capOnly && T.castling && G.castling && !(code & MOVED)) {
    for (let dir = -1; dir <= 1; dir += 2) {
      let tx = x + dir;
      while (tx >= 0 && tx < W && b[y * W + tx] === 0) tx += dir;
      if (tx < 0 || tx >= W) continue;
      const rc = b[y * W + tx];
      if (((rc >> 6) & 1) !== c || rc & MOVED || !G.types[(rc & 63) - 1].castleRook) continue;
      if (Math.abs(tx - x) < 3) continue;
      out.push(sq | ((y * W + x + 2 * dir) << 8) | (F_CASTLE << 22));
    }
  }
}

// Lances pseudo-legais (sem verificar se o rei fica em xeque)
function genPseudo(G, S, out, capOnly = false) {
  const ex = S.ex;
  const inExtra = !!ex;
  const start = out.length;
  if (ex && ex.same) {
    if (ex.sq >= 0 && S.b[ex.sq] && ((S.b[ex.sq] >> 6) & 1) === S.turn) genPiece(G, S, ex.sq, out, capOnly || ex.cap === 1, true);
  } else {
    const b = S.b;
    const turn = S.turn;
    for (let sq = 0; sq < G.N; sq++) {
      const code = b[sq];
      if (code && ((code >> 6) & 1) === turn) genPiece(G, S, sq, out, capOnly || (ex && ex.cap === 1), inExtra);
    }
  }
  if (ex && ex.cap) {
    // filtra as capturas conforme o lance extra
    let w = start;
    for (let i = start; i < out.length; i++) {
      const m = out[i];
      const isCap = isCapture(S, m);
      if ((ex.cap === 1 && isCap) || (ex.cap === 2 && !isCap)) out[w++] = m;
    }
    out.length = w;
  }
  return out;
}

function isCapture(S, m) {
  const f = (m >> 22) & 3;
  if (f === F_EP) return true;
  if (f !== F_NORMAL) return false;
  return S.b[(m >> 8) & 255] !== 0;
}

// A peça em sq ataca a casa target? (ignora en passant e roque)
function attacksSquare(G, S, sq, target) {
  const b = S.b;
  const code = b[sq];
  const t = (code & 63) - 1;
  const c = (code >> 6) & 1;
  const T = G.types[t];
  const sgn = c ? -1 : 1;
  const ddx = G.X[target] - G.X[sq];
  const ddy = G.Y[target] - G.Y[sq];
  const rep = usesReplace(G, S, T, sq, c, code, false);
  for (const set of T.sets) {
    if (rep && !set.replace) continue;
    if (set.cond !== 0 && !setActive(G, S, set, sq, c, code, false)) continue;
    for (const st of set.steps) {
      if (!(st.mode & CAP)) continue;
      const dx = st.dx * sgn;
      const dy = st.dy * sgn;
      if (!st.ride) {
        if (dx === ddx && dy === ddy) return true;
        continue;
      }
      let k;
      if (dx !== 0) {
        if (ddx % dx !== 0) continue;
        k = ddx / dx;
        if (dy * k !== ddy) continue;
      } else {
        if (ddx !== 0 || dy === 0 || ddy % dy !== 0) continue;
        k = ddy / dy;
      }
      if (k < 1 || (st.range && k > st.range)) continue;
      const step = dy * G.W + dx;
      let blockers = 0;
      for (let i = 1; i < k; i++) if (b[sq + i * step] !== 0) blockers++;
      if (st.hop ? blockers === 1 : blockers === 0) return true;
    }
  }
  return false;
}

function isAttacked(G, S, target, byColor) {
  const b = S.b;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === byColor && sq !== target && attacksSquare(G, S, sq, target)) return true;
  }
  return false;
}

// Todas as peças reais da cor existem e nenhuma está atacada
function royalSafe(G, S, color) {
  if (!G.hasRoyal[color]) return true;
  const b = S.b;
  let found = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal) {
      found++;
      if (isAttacked(G, S, sq, 1 - color)) return false;
    }
  }
  return found > 0;
}

function inCheck(G, S, color) {
  if (G.royalMode !== 1 || !G.hasRoyal[color]) return false;
  const b = S.b;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal && isAttacked(G, S, sq, 1 - color)) return true;
  }
  return false;
}

function royalCount(G, S, color) {
  let n = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = S.b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal) n++;
  }
  return n;
}

// Verifica um lance já aplicado (N = estado depois do lance).
function legalAfter(G, S, m, N) {
  if (G.royalMode !== 1 || !G.hasRoyal[S.turn]) return true;
  const me = S.turn;
  if (((m >> 22) & 3) === F_CASTLE) {
    const from = m & 255;
    const to = (m >> 8) & 255;
    if (G.types[(S.b[from] & 63) - 1].royal) {
      if (isAttacked(G, S, from, 1 - me)) return false;
      const mid = (from + to) >> 1;
      if (isAttacked(G, S, mid, 1 - me)) return false;
    }
  }
  if (N.res && N.res.w === me) return royalCount(G, N, me) > 0;
  return royalSafe(G, N, me);
}

function legalMoves(G, S) {
  if (S.res) return [];
  const pseudo = genPseudo(G, S, []);
  let out = [];
  for (const m of pseudo) {
    const N = applyMove(G, S, m, false);
    if (legalAfter(G, S, m, N)) out.push(m);
  }
  if (G.forcedCapture) {
    const caps = out.filter((m) => isCapture(S, m));
    if (caps.length) out = caps;
  }
  if (S.ex && (S.ex.optional || out.length === 0)) out.push(PASS);
  return out;
}

// ---------------------------------------------------------------------------
// Aplicação de lances e gatilhos
// ---------------------------------------------------------------------------

function trigCondsHold(G, N, tr, ctx) {
  for (const cd of tr.conds) {
    switch (cd.type) {
      case 'notExtra':
        if (ctx.wasExtra) return false;
        break;
      case 'isExtra':
        if (!ctx.wasExtra) return false;
        break;
      case 'firstMove':
        if (!ctx.firstMove) return false;
        break;
      case 'hasTag':
        if (ctx.sq < 0 || !(N.tg[ctx.sq] & cd.bit)) return false;
        break;
      case 'noTag':
        if (ctx.sq >= 0 && N.tg[ctx.sq] & cd.bit) return false;
        break;
      case 'minRank':
        if (relRank(G, ctx.to, ctx.color) < cd.rank) return false;
        break;
      case 'enemyHalf':
        if (relRank(G, ctx.to, ctx.color) <= Math.ceil(G.H / 2)) return false;
        break;
      case 'ownHalf':
        if (relRank(G, ctx.to, ctx.color) > Math.floor(G.H / 2)) return false;
        break;
      case 'targetStronger':
        if (ctx.capType < 0 || !(G.types[ctx.capType].value > G.types[ctx.moverType].value)) return false;
        break;
      case 'targetWeaker':
        if (ctx.capType < 0 || !(G.types[ctx.capType].value < G.types[ctx.moverType].value)) return false;
        break;
      case 'transformed':
        if (!ctx.wasTransformed) return false;
        break;
      case 'notTransformed':
        if (ctx.wasTransformed) return false;
        break;
      default:
        return false;
    }
  }
  return true;
}

function removeAt(N, sq, log, why) {
  const code = N.b[sq];
  if (!code) return;
  if (log) log.push({ type: 'removed', sq, code, why });
  N.b[sq] = 0;
  N.tg[sq] = 0;
  N.tf[sq] = 0;
}

// Transforma a peça em ctx.sq, lembrando qual era a peça original
function transformAt(G, N, ctx, newT, ef, log) {
  const sq = ctx.sq;
  if (sq < 0) return;
  const oldT = (N.b[sq] & 63) - 1;
  if (oldT === newT) return;
  N.b[sq] = mk(newT, ctx.color, 1);
  if (log) log.push({ type: 'become', sq, from: oldT, to: newT });
  if (!G.usesTransform) return;
  const cur = N.tf[sq];
  const orig = cur ? (cur & 63) - 1 : oldT;
  if (orig === newT) N.tf[sq] = 0;
  else N.tf[sq] = (orig + 1) | (ef.backCode << 6) | ((ef.backCode === 3 ? Math.min(255, ef.turns + 1) : 0) << 8);
  ctx.transformed = true;
}

// Desfaz a transformação da peça em sq
function revertAt(N, sq, log) {
  const cur = N.tf[sq];
  const code = N.b[sq];
  N.tf[sq] = 0;
  if (!cur || !code) return;
  const orig = (cur & 63) - 1;
  const now = (code & 63) - 1;
  N.b[sq] = mk(orig, (code >> 6) & 1, 1);
  if (log) log.push({ type: 'revert', sq, from: now, to: orig });
}

// Fim da vez de uma cor: volta automática "no fim da vez" e contagem de lances
function endTurnFor(G, N, color, log) {
  if (!G.usesTransform) return;
  for (let sq = 0; sq < G.N; sq++) {
    const t = N.tf[sq];
    if (!t) continue;
    const code = N.b[sq];
    if (!code || ((code >> 6) & 1) !== color) continue;
    const mode = (t >> 6) & 3;
    if (mode === 1) revertAt(N, sq, log);
    else if (mode === 3) {
      const left = ((t >> 8) & 255) - 1;
      if (left <= 0) revertAt(N, sq, log);
      else N.tf[sq] = (t & 255) | (left << 8);
    }
  }
}

function applyEffect(G, N, ef, ctx, log) {
  const W = G.W;
  switch (ef.type) {
    case 'becomeCaptured':
      if (ctx.capType >= 0) transformAt(G, N, ctx, ctx.capType, ef, log);
      break;
    case 'become':
      transformAt(G, N, ctx, ef.t, ef, log);
      break;
    case 'revert':
      if (ctx.sq >= 0 && N.tf[ctx.sq]) revertAt(N, ctx.sq, log);
      break;
    case 'extraMove':
      ctx.extra = { same: ef.same, cap: ef.cap, optional: ef.optional };
      break;
    case 'explode': {
      const cx = G.X[ctx.to];
      const cy = G.Y[ctx.to];
      const r = ef.radius || 1;
      const hit = [];
      for (let dy = -r; dy <= r; dy++) {
        const ty = cy + dy;
        if (ty < 0 || ty >= G.H) continue;
        for (let dx = -r; dx <= r; dx++) {
          const tx = cx + dx;
          if (tx < 0 || tx >= W) continue;
          const sq = ty * W + tx;
          if (sq === ctx.to) continue;
          const code = N.b[sq];
          if (!code) continue;
          const T2 = G.types[(code & 63) - 1];
          const own = ((code >> 6) & 1) === ctx.color;
          if ((ef.side === 1 && own) || (ef.side === 2 && !own)) continue;
          if (ef.sparePawns && T2.pawn) continue;
          if (ef.spareRoyal && T2.royal) continue;
          hit.push(sq);
        }
      }
      if (log) log.push({ type: 'explode', sq: ctx.to, radius: r });
      hit.forEach((sq) => removeAt(N, sq, log, 'explode'));
      if (ef.self && ctx.sq === ctx.to) {
        removeAt(N, ctx.sq, log, 'explode');
        ctx.sq = -1;
      }
      break;
    }
    case 'removeSelf':
      if (ctx.sq >= 0) {
        removeAt(N, ctx.sq, log, 'self');
        ctx.sq = -1;
      }
      break;
    case 'leaveBehind':
      if (N.b[ctx.from] === 0) {
        N.b[ctx.from] = mk(ef.t, ctx.color, 1);
        N.tf[ctx.from] = 0;
        if (log) log.push({ type: 'spawn', sq: ctx.from, t: ef.t });
      }
      break;
    case 'recruit':
      if (ctx.capType >= 0 && !G.types[ctx.capType].royal && N.b[ctx.from] === 0) {
        N.b[ctx.from] = mk(ctx.capType, ctx.color, 1);
        N.tf[ctx.from] = 0;
        if (log) log.push({ type: 'spawn', sq: ctx.from, t: ctx.capType, recruit: true });
      }
      break;
    case 'addTag':
      if (ctx.sq >= 0 && !(N.tg[ctx.sq] & ef.bit)) {
        N.tg[ctx.sq] |= ef.bit;
        if (log) log.push({ type: 'tag', sq: ctx.sq, tag: ef.tag });
      }
      break;
    case 'removeTag':
      if (ctx.sq >= 0 && N.tg[ctx.sq] & ef.bit) {
        N.tg[ctx.sq] &= ~ef.bit;
        if (log) log.push({ type: 'untag', sq: ctx.sq, tag: ef.tag });
      }
      break;
    case 'win':
      ctx.win = true;
      break;
    case 'lose':
      ctx.lose = true;
      break;
    default:
      break;
  }
}

function countPieces(G, S, color) {
  let n = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = S.b[sq];
    if (code && ((code >> 6) & 1) === color) n++;
  }
  return n;
}

// Aplica o lance m ao estado S e devolve um novo estado.
// log = true registra os eventos (capturas, transformações...) em N.ev para a interface.
function applyMove(G, S, m, log = false) {
  const N = cloneState(G, S);
  const ev = log ? [] : null;
  N.ev = ev;
  const flag = (m >> 22) & 3;
  const me = S.turn;
  N.ex = null;
  if (flag === F_PASS) {
    N.turn = 1 - me;
    N.ply = S.ply + 1;
    if (ev) ev.push({ type: 'pass' });
    endTurnFor(G, N, me, ev);
    N.hash = computeHash(G, N);
    return N;
  }
  const from = m & 255;
  const to = (m >> 8) & 255;
  const promo = ((m >> 16) & 63) - 1;
  const b = N.b;
  const code = b[from];
  const moverType = (code & 63) - 1;
  const T = G.types[moverType];
  let capType = -1;
  let capSq = -1;

  if (flag === F_EP) {
    capSq = S.epV;
    capType = (b[capSq] & 63) - 1;
    if (ev) ev.push({ type: 'capture', sq: capSq, code: b[capSq] });
    b[capSq] = 0;
    N.tg[capSq] = 0;
    N.tf[capSq] = 0;
  } else if (b[to] !== 0) {
    capSq = to;
    capType = (b[to] & 63) - 1;
    if (ev) ev.push({ type: 'capture', sq: to, code: b[to] });
  }

  const tagsMoving = G.usesTags ? N.tg[from] : 0;
  b[to] = code | MOVED;
  b[from] = 0;
  if (G.usesTags) {
    N.tg[to] = tagsMoving;
    N.tg[from] = 0;
  }
  const prevTf = G.usesTransform ? N.tf[from] : 0;
  const prevBack = (prevTf >> 6) & 3;
  if (G.usesTransform) {
    N.tf[to] = N.tf[from];
    N.tf[from] = 0;
  }

  if (flag === F_CASTLE) {
    const dir = G.X[to] > G.X[from] ? 1 : -1;
    let rx = G.X[to] + dir;
    const y = G.Y[from];
    while (rx >= 0 && rx < G.W && b[y * G.W + rx] === 0) rx += dir;
    const rFrom = y * G.W + rx;
    const rTo = y * G.W + G.X[from] + dir;
    if (rx >= 0 && rx < G.W) {
      b[rTo] = b[rFrom] | MOVED;
      b[rFrom] = 0;
      if (G.usesTags) {
        N.tg[rTo] = N.tg[rFrom];
        N.tg[rFrom] = 0;
      }
      if (G.usesTransform) {
        N.tf[rTo] = N.tf[rFrom];
        N.tf[rFrom] = 0;
      }
      if (ev) ev.push({ type: 'castle', from: rFrom, to: rTo });
    }
  }

  if (promo >= 0) {
    b[to] = mk(promo, me, 1);
    N.tf[to] = 0;
    if (ev) ev.push({ type: 'promote', sq: to, t: promo });
  }

  const ctx = {
    from,
    to,
    sq: to,
    color: me,
    moverType,
    capType,
    capSq,
    wasExtra: !!S.ex,
    firstMove: !(code & MOVED),
    extra: null,
    win: false,
    lose: false,
    transformed: false,
    wasTransformed: prevTf !== 0,
  };

  const trs = G.triggers;
  for (let i = 0; i < trs.length; i++) {
    const tr = trs[i];
    if (tr.event === 0 && capType < 0) continue;
    if (tr.event === 1 && capType >= 0) continue;
    if (tr.pieceMask && !tr.pieceMask[moverType]) continue;
    if (tr.targetMask && !tr.targetMask[capType]) continue;
    if (tr.conds.length && !trigCondsHold(G, N, tr, ctx)) continue;
    for (const ef of tr.effects) applyEffect(G, N, ef, ctx, ev);
  }

  // volta automática "depois do próximo lance dela"
  if (prevBack === 2 && ctx.sq >= 0 && !ctx.transformed && N.tf[ctx.sq]) revertAt(N, ctx.sq, ev);

  // en passant: peão (ou peça com a marca de peão) que andou 2+ casas em linha reta
  N.ep = -1;
  N.epV = -1;
  if (T.pawn && flag === F_NORMAL && capType < 0 && ctx.sq === to && G.X[from] === G.X[to]) {
    const dyAbs = Math.abs(G.Y[to] - G.Y[from]);
    if (dyAbs >= 2) {
      N.ep = to + (me === 0 ? -G.W : G.W);
      N.epV = to;
    }
  }

  N.half = capType >= 0 || T.pawn ? 0 : S.half + 1;
  N.ply = S.ply + 1;

  // resultado imediato
  let res = null;
  if (ctx.lose) res = { w: 1 - me, r: 'rule' };
  else if (ctx.win) res = { w: me, r: 'rule' };
  if (!res && G.royalMode !== 0) {
    if (G.hasRoyal[me] && royalCount(G, N, me) === 0) res = { w: 1 - me, r: 'royalLost' };
    else if (G.hasRoyal[1 - me] && royalCount(G, N, 1 - me) === 0) res = { w: me, r: 'royalCaptured' };
  }
  if (!res && G.goal && ctx.sq >= 0) {
    const nt = (b[ctx.sq] & 63) - 1;
    if (!G.goal.pieces || G.goal.pieces[nt]) {
      const reached = G.goal.lastRank ? relRank(G, ctx.sq, me) === G.H : G.goal.mask[ctx.sq] === 1;
      if (reached) res = { w: me, r: 'goal' };
    }
  }
  if (!res && G.extinction !== 'off') {
    const mine = countPieces(G, N, me);
    const theirs = countPieces(G, N, 1 - me);
    if (G.extinction === 'loss') {
      if (theirs === 0) res = { w: me, r: 'extinct' };
      else if (mine === 0) res = { w: 1 - me, r: 'extinct' };
    } else {
      if (mine === 0) res = { w: me, r: 'emptied' };
      else if (theirs === 0) res = { w: 1 - me, r: 'emptied' };
    }
  }
  if (!res && G.fifty && N.half >= G.fifty * 2) res = { w: -1, r: 'fifty' };
  N.res = res;

  if (ctx.extra && !res && (!ctx.extra.same || ctx.sq >= 0)) {
    N.ex = { sq: ctx.extra.same ? ctx.sq : -1, same: ctx.extra.same, cap: ctx.extra.cap, optional: ctx.extra.optional };
    N.turn = me;
    if (ev) ev.push({ type: 'extra', sq: N.ex.sq });
  } else {
    N.turn = 1 - me;
    endTurnFor(G, N, me, ev);
  }

  N.hash = computeHash(G, N);
  return N;
}

// ---------------------------------------------------------------------------
// Situação da partida
// ---------------------------------------------------------------------------

// hist: lista de hashes das posições já ocorridas (incluindo a atual)
function gameStatus(G, S, hist) {
  if (S.res) return { over: true, w: S.res.w, r: S.res.r, moves: [], check: false };
  const moves = legalMoves(G, S);
  const check = inCheck(G, S, S.turn);
  if (moves.length === 0) {
    if (check) return { over: true, w: 1 - S.turn, r: 'mate', moves, check };
    const st = G.stalemate;
    return { over: true, w: st === 'draw' ? -1 : st === 'loss' ? 1 - S.turn : S.turn, r: 'stalemate', moves, check };
  }
  if (G.repetition && hist && !S.ex) {
    let n = 0;
    for (const h of hist) if (h === S.hash) n++;
    if (n >= G.repetition) return { over: true, w: -1, r: 'repetition', moves: [], check };
  }
  if (S.ply >= MAX_PLY) return { over: true, w: -1, r: 'limit', moves: [], check };
  return { over: false, moves, check };
}

const RESULT_TEXT = {
  mate: 'Xeque-mate',
  stalemate: 'Afogamento (sem lances)',
  royalCaptured: 'Rei capturado',
  royalLost: 'Rei perdido',
  goal: 'Objetivo alcançado',
  extinct: 'Sem peças no tabuleiro',
  emptied: 'Ficou sem peças',
  rule: 'Regra especial',
  fifty: 'Regra dos lances sem captura',
  repetition: 'Posição repetida',
  limit: 'Limite de lances',
  resign: 'Desistência',
};

// Texto curto do lance, por exemplo "Cb1-c3", "e4xd5", "O-O", "e7-e8=D"
function moveText(G, S, m) {
  const flag = mFlag(m);
  if (flag === F_PASS) return 'passa';
  const from = mFrom(m);
  const to = mTo(m);
  if (flag === F_CASTLE) return G.X[to] > G.X[from] ? 'O-O' : 'O-O-O';
  const T = G.types[pType(S.b[from])];
  const cap = flag === F_EP || S.b[to] !== 0;
  let s = (T.pawn ? '' : T.id) + squareName(G, from) + (cap ? 'x' : '-') + squareName(G, to);
  const p = mPromo(m);
  if (p >= 0) s += '=' + G.types[p].id;
  return s;
}

function moveKey(m) {
