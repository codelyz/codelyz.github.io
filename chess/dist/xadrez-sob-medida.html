    tg: G.usesTags ? S.tg.slice() : S.tg,
    tf: G.usesTransform ? S.tf.slice() : S.tf,
    turn: S.turn,
    ep: S.ep,
    epV: S.epV,
    ex: S.ex,
    half: S.half,
    ply: S.ply,
    res: S.res,
    hash: S.hash,
    ev: null,
  };
}

function serializeState(S) {
  return { b: Array.from(S.b), tg: Array.from(S.tg), tf: Array.from(S.tf), turn: S.turn, ep: S.ep, epV: S.epV, ex: S.ex, half: S.half, ply: S.ply, res: S.res, hash: S.hash };
}

function deserializeState(o) {
  return {
    b: Uint8Array.from(o.b),
    tg: Int32Array.from(o.tg),
    tf: o.tf ? Int32Array.from(o.tf) : new Int32Array(o.b.length),
    turn: o.turn,
    ep: o.ep,
    epV: o.epV,
    ex: o.ex || null,
    half: o.half,
    ply: o.ply,
    res: o.res || null,
    hash: o.hash,
    ev: null,
  };
}

function computeHash(G, S) {
  const b = S.b;
  const tg = S.tg;
  const Z1 = G.Z1;
  const Z2 = G.Z2;
  let h1 = S.turn ? 0x2545f491 : 0;
  let h2 = S.turn ? 0x4f6cdd1d : 0;
  for (let sq = 0, base = 0; sq < G.N; sq++, base += 256) {
    let c = b[sq];
    if (!c) continue;
    if (!G.movedMatters[(c & 63) - 1]) c &= ~MOVED;
    h1 ^= Z1[base + c];
    h2 ^= Z2[base + c];
    const f = S.tf[sq];
    if (f) {
      h1 ^= Math.imul(f + sq * 0x51ed, 0x9e3779b1);
      h2 ^= Math.imul(f ^ (sq * 0x2c1b), 0x7feb352d);
    }
    const t = tg[sq];
    if (t) {
      h1 ^= Math.imul(t + sq * 0x9e37, 0x85ebca6b);
      h2 ^= Math.imul(t ^ (sq * 0x7f4a), 0xc2b2ae35);
    }
  }
  if (S.ep >= 0) {
    h1 ^= Z1[S.ep * 256];
    h2 ^= Z2[S.ep * 256];
  }
  if (S.ex) {
    const k = (S.ex.sq + 2) * 16 + S.ex.cap * 4 + (S.ex.same ? 2 : 0) + (S.ex.optional ? 1 : 0);
    h1 ^= Math.imul(k, 0x27d4eb2d) ^ 0x3c6ef372;
    h2 ^= Math.imul(k, 0x165667b1) ^ 0x1b873593;
  }
  return (h1 >>> 0) * 2097152 + ((h2 >>> 0) & 0x1fffff);
}

// ---------------------------------------------------------------------------
// Geração de lances
// ---------------------------------------------------------------------------

const relRank = (G, sq, c) => (c === 0 ? G.Y[sq] + 1 : G.H - G.Y[sq]);

function setActive(G, S, set, sq, c, code, inExtra) {
  switch (set.cond) {
    case 0:
      return true;
    case 1:
      return !(code & MOVED);
    case 2:
      return !!(code & MOVED);
    case 3:
      return relRank(G, sq, c) > Math.ceil(G.H / 2);
    case 4:
      return relRank(G, sq, c) <= Math.floor(G.H / 2);
    case 5:
      return (S.tg[sq] & set.arg) !== 0;
    case 6:
      return (S.tg[sq] & set.arg) === 0;
    case 7:
      return inExtra;
    case 8: {
      if (set.arg === -2) return false;
      const x = G.X[sq];
      const y = G.Y[sq];
      for (let dy = -1; dy <= 1; dy++) {
        const ty = y + dy;
        if (ty < 0 || ty >= G.H) continue;
        for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          const tx = x + dx;
          if (tx < 0 || tx >= G.W) continue;
          const o = S.b[ty * G.W + tx];
          if (o && ((o >> 6) & 1) === c && (set.arg < 0 || (o & 63) - 1 === set.arg)) return true;
        }
      }
      return false;
    }
    case 9:
      return relRank(G, sq, c) >= set.arg;
    case 10:
      return S.tf[sq] !== 0;
    default:
      return false;
  }
}

function usesReplace(G, S, T, sq, c, code, inExtra) {
  if (!T.hasReplace) return false;
  for (const set of T.sets) if (set.replace && setActive(G, S, set, sq, c, code, inExtra)) return true;
  return false;
}

// Marcador para não repetir o mesmo destino quando dois movimentos levam à mesma casa
const SEEN = new Int32Array(256);
let seenStamp = 0;

// Gera os lances de uma peça. capOnly: só capturas (e promoções).
function genPiece(G, S, sq, out, capOnly, inExtra) {
  const b = S.b;
  const code = b[sq];
  const t = (code & 63) - 1;
  const c = (code >> 6) & 1;
  const T = G.types[t];
  const W = G.W;
  const H = G.H;
  const x = G.X[sq];
  const y = G.Y[sq];
  const sgn = c ? -1 : 1;
  const rep = usesReplace(G, S, T, sq, c, code, inExtra);
  const canEp = G.enPassant && T.pawn && S.ep >= 0 && S.epV >= 0 && b[S.epV] && ((b[S.epV] >> 6) & 1) !== c;
  const promo = T.promoTo.length > 0;
  const promoLimit = H - T.promoZone;
  // No modo xeque-mate o Rei nunca é capturado (nem num lance extra depois de um xeque)
  const noRoyalCap = G.royalMode === 1;
  if (++seenStamp > 2000000000) {
    SEEN.fill(0);
    seenStamp = 1;
  }
  const stamp = seenStamp;

  const push = (to, flag) => {
    if (SEEN[to] === stamp) return;
    SEEN[to] = stamp;
    if (promo && relRank(G, to, c) > promoLimit) {
      for (const p of T.promoTo) out.push(sq | (to << 8) | ((p + 1) << 16) | (flag << 22));
    } else {
      out.push(sq | (to << 8) | (flag << 22));
    }
  };
  const pushQuiet = (to) => {
    if (!capOnly) push(to, 0);
    else if (promo && relRank(G, to, c) > promoLimit) push(to, 0);
  };

  for (const set of T.sets) {
    if (rep && !set.replace) continue;
    if (set.cond !== 0 && !setActive(G, S, set, sq, c, code, inExtra)) continue;
    for (const st of set.steps) {
      const dx = st.dx * sgn;
      const dy = st.dy * sgn;
      let tx = x + dx;
      let ty = y + dy;
      if (!st.ride) {
        if (tx < 0 || tx >= W || ty < 0 || ty >= H) continue;
        const to = ty * W + tx;
        const occ = b[to];
        if (occ === 0) {
          if (st.mode & MOVE) pushQuiet(to);
          else if (canEp && to === S.ep && st.mode & CAP) push(to, F_EP);
        } else if (((occ >> 6) & 1) !== c && st.mode & CAP && !(noRoyalCap && G.types[(occ & 63) - 1].royal)) push(to, 0);
        continue;
      }
      const lim = st.range || 99;
      let k = 1;
      let screened = false;
      while (k <= lim && tx >= 0 && tx < W && ty >= 0 && ty < H) {
        const to = ty * W + tx;
        const occ = b[to];
        if (occ === 0) {
          if (!st.hop || screened) {
            if (st.mode & MOVE) pushQuiet(to);
            else if (canEp && to === S.ep && st.mode & CAP) push(to, F_EP);
          }
        } else if (st.hop && !screened) {
          screened = true;
        } else {
          if (((occ >> 6) & 1) !== c && st.mode & CAP && !(noRoyalCap && G.types[(occ & 63) - 1].royal)) push(to, 0);
          break;
        }
        tx += dx;
        ty += dy;
        k++;
      }
    }
  }

  if (!capOnly && T.castling && G.castling && !(code & MOVED)) {
    for (let dir = -1; dir <= 1; dir += 2) {
      let tx = x + dir;
      while (tx >= 0 && tx < W && b[y * W + tx] === 0) tx += dir;
      if (tx < 0 || tx >= W) continue;
      const rc = b[y * W + tx];
      if (((rc >> 6) & 1) !== c || rc & MOVED || !G.types[(rc & 63) - 1].castleRook) continue;
      if (Math.abs(tx - x) < 3) continue;
      out.push(sq | ((y * W + x + 2 * dir) << 8) | (F_CASTLE << 22));
    }
  }
}

// Lances pseudo-legais (sem verificar se o rei fica em xeque)
function genPseudo(G, S, out, capOnly = false) {
  const ex = S.ex;
  const inExtra = !!ex;
  const start = out.length;
  if (ex && ex.same) {
    if (ex.sq >= 0 && S.b[ex.sq] && ((S.b[ex.sq] >> 6) & 1) === S.turn) genPiece(G, S, ex.sq, out, capOnly || ex.cap === 1, true);
  } else {
    const b = S.b;
    const turn = S.turn;
    for (let sq = 0; sq < G.N; sq++) {
      const code = b[sq];
      if (code && ((code >> 6) & 1) === turn) genPiece(G, S, sq, out, capOnly || (ex && ex.cap === 1), inExtra);
    }
  }
  if (ex && ex.cap) {
    // filtra as capturas conforme o lance extra
    let w = start;
    for (let i = start; i < out.length; i++) {
      const m = out[i];
      const isCap = isCapture(S, m);
      if ((ex.cap === 1 && isCap) || (ex.cap === 2 && !isCap)) out[w++] = m;
    }
    out.length = w;
  }
  return out;
}

function isCapture(S, m) {
  const f = (m >> 22) & 3;
  if (f === F_EP) return true;
  if (f !== F_NORMAL) return false;
  return S.b[(m >> 8) & 255] !== 0;
}

// A peça em sq ataca a casa target? (ignora en passant e roque)
function attacksSquare(G, S, sq, target) {
  const b = S.b;
  const code = b[sq];
  const t = (code & 63) - 1;
  const c = (code >> 6) & 1;
  const T = G.types[t];
  const sgn = c ? -1 : 1;
  const ddx = G.X[target] - G.X[sq];
  const ddy = G.Y[target] - G.Y[sq];
  const rep = usesReplace(G, S, T, sq, c, code, false);
  for (const set of T.sets) {
    if (rep && !set.replace) continue;
    if (set.cond !== 0 && !setActive(G, S, set, sq, c, code, false)) continue;
    for (const st of set.steps) {
      if (!(st.mode & CAP)) continue;
      const dx = st.dx * sgn;
      const dy = st.dy * sgn;
      if (!st.ride) {
        if (dx === ddx && dy === ddy) return true;
        continue;
      }
      let k;
      if (dx !== 0) {
        if (ddx % dx !== 0) continue;
        k = ddx / dx;
        if (dy * k !== ddy) continue;
      } else {
        if (ddx !== 0 || dy === 0 || ddy % dy !== 0) continue;
        k = ddy / dy;
      }
      if (k < 1 || (st.range && k > st.range)) continue;
      const step = dy * G.W + dx;
      let blockers = 0;
      for (let i = 1; i < k; i++) if (b[sq + i * step] !== 0) blockers++;
      if (st.hop ? blockers === 1 : blockers === 0) return true;
    }
  }
  return false;
}

function isAttacked(G, S, target, byColor) {
  const b = S.b;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === byColor && sq !== target && attacksSquare(G, S, sq, target)) return true;
  }
  return false;
}

// Todas as peças reais da cor existem e nenhuma está atacada
function royalSafe(G, S, color) {
  if (!G.hasRoyal[color]) return true;
  const b = S.b;
  let found = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal) {
      found++;
      if (isAttacked(G, S, sq, 1 - color)) return false;
    }
  }
  return found > 0;
}

function inCheck(G, S, color) {
  if (G.royalMode !== 1 || !G.hasRoyal[color]) return false;
  const b = S.b;
  for (let sq = 0; sq < G.N; sq++) {
    const code = b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal && isAttacked(G, S, sq, 1 - color)) return true;
  }
  return false;
}

function royalCount(G, S, color) {
  let n = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = S.b[sq];
    if (code && ((code >> 6) & 1) === color && G.types[(code & 63) - 1].royal) n++;
  }
  return n;
}

// Verifica um lance já aplicado (N = estado depois do lance).
function legalAfter(G, S, m, N) {
  if (G.royalMode !== 1 || !G.hasRoyal[S.turn]) return true;
  const me = S.turn;
  if (((m >> 22) & 3) === F_CASTLE) {
    const from = m & 255;
    const to = (m >> 8) & 255;
    if (G.types[(S.b[from] & 63) - 1].royal) {
      if (isAttacked(G, S, from, 1 - me)) return false;
      const mid = (from + to) >> 1;
      if (isAttacked(G, S, mid, 1 - me)) return false;
    }
  }
  if (N.res && N.res.w === me) return royalCount(G, N, me) > 0;
  return royalSafe(G, N, me);
}

function legalMoves(G, S) {
  if (S.res) return [];
  const pseudo = genPseudo(G, S, []);
  let out = [];
  for (const m of pseudo) {
    const N = applyMove(G, S, m, false);
    if (legalAfter(G, S, m, N)) out.push(m);
  }
  if (G.forcedCapture) {
    const caps = out.filter((m) => isCapture(S, m));
    if (caps.length) out = caps;
  }
  if (S.ex && (S.ex.optional || out.length === 0)) out.push(PASS);
  return out;
}

// ---------------------------------------------------------------------------
// Aplicação de lances e gatilhos
// ---------------------------------------------------------------------------

function trigCondsHold(G, N, tr, ctx) {
  for (const cd of tr.conds) {
    switch (cd.type) {
      case 'notExtra':
        if (ctx.wasExtra) return false;
        break;
      case 'isExtra':
        if (!ctx.wasExtra) return false;
        break;
      case 'firstMove':
        if (!ctx.firstMove) return false;
        break;
      case 'hasTag':
        if (ctx.sq < 0 || !(N.tg[ctx.sq] & cd.bit)) return false;
        break;
      case 'noTag':
        if (ctx.sq >= 0 && N.tg[ctx.sq] & cd.bit) return false;
        break;
      case 'minRank':
        if (relRank(G, ctx.to, ctx.color) < cd.rank) return false;
        break;
      case 'enemyHalf':
        if (relRank(G, ctx.to, ctx.color) <= Math.ceil(G.H / 2)) return false;
        break;
      case 'ownHalf':
        if (relRank(G, ctx.to, ctx.color) > Math.floor(G.H / 2)) return false;
        break;
      case 'targetStronger':
        if (ctx.capType < 0 || !(G.types[ctx.capType].value > G.types[ctx.moverType].value)) return false;
        break;
      case 'targetWeaker':
        if (ctx.capType < 0 || !(G.types[ctx.capType].value < G.types[ctx.moverType].value)) return false;
        break;
      case 'transformed':
        if (!ctx.wasTransformed) return false;
        break;
      case 'notTransformed':
        if (ctx.wasTransformed) return false;
        break;
      default:
        return false;
    }
  }
  return true;
}

function removeAt(N, sq, log, why) {
  const code = N.b[sq];
  if (!code) return;
  if (log) log.push({ type: 'removed', sq, code, why });
  N.b[sq] = 0;
  N.tg[sq] = 0;
  N.tf[sq] = 0;
}

// Transforma a peça em ctx.sq, lembrando qual era a peça original
function transformAt(G, N, ctx, newT, ef, log) {
  const sq = ctx.sq;
  if (sq < 0) return;
  const oldT = (N.b[sq] & 63) - 1;
  if (oldT === newT) return;
  N.b[sq] = mk(newT, ctx.color, 1);
  if (log) log.push({ type: 'become', sq, from: oldT, to: newT });
  if (!G.usesTransform) return;
  const cur = N.tf[sq];
  const orig = cur ? (cur & 63) - 1 : oldT;
  if (orig === newT) N.tf[sq] = 0;
  else N.tf[sq] = (orig + 1) | (ef.backCode << 6) | ((ef.backCode === 3 ? Math.min(255, ef.turns + 1) : 0) << 8);
  ctx.transformed = true;
}

// Desfaz a transformação da peça em sq
function revertAt(N, sq, log) {
  const cur = N.tf[sq];
  const code = N.b[sq];
  N.tf[sq] = 0;
  if (!cur || !code) return;
  const orig = (cur & 63) - 1;
  const now = (code & 63) - 1;
  N.b[sq] = mk(orig, (code >> 6) & 1, 1);
  if (log) log.push({ type: 'revert', sq, from: now, to: orig });
}

// Fim da vez de uma cor: volta automática "no fim da vez" e contagem de lances
function endTurnFor(G, N, color, log) {
  if (!G.usesTransform) return;
  for (let sq = 0; sq < G.N; sq++) {
    const t = N.tf[sq];
    if (!t) continue;
    const code = N.b[sq];
    if (!code || ((code >> 6) & 1) !== color) continue;
    const mode = (t >> 6) & 3;
    if (mode === 1) revertAt(N, sq, log);
    else if (mode === 3) {
      const left = ((t >> 8) & 255) - 1;
      if (left <= 0) revertAt(N, sq, log);
      else N.tf[sq] = (t & 255) | (left << 8);
    }
  }
}

function applyEffect(G, N, ef, ctx, log) {
  const W = G.W;
  switch (ef.type) {
    case 'becomeCaptured':
      if (ctx.capType >= 0) transformAt(G, N, ctx, ctx.capType, ef, log);
      break;
    case 'become':
      transformAt(G, N, ctx, ef.t, ef, log);
      break;
    case 'revert':
      if (ctx.sq >= 0 && N.tf[ctx.sq]) revertAt(N, ctx.sq, log);
      break;
    case 'extraMove':
      ctx.extra = { same: ef.same, cap: ef.cap, optional: ef.optional };
      break;
    case 'explode': {
      const cx = G.X[ctx.to];
      const cy = G.Y[ctx.to];
      const r = ef.radius || 1;
      const hit = [];
      for (let dy = -r; dy <= r; dy++) {
        const ty = cy + dy;
        if (ty < 0 || ty >= G.H) continue;
        for (let dx = -r; dx <= r; dx++) {
          const tx = cx + dx;
          if (tx < 0 || tx >= W) continue;
          const sq = ty * W + tx;
          if (sq === ctx.to) continue;
          const code = N.b[sq];
          if (!code) continue;
          const T2 = G.types[(code & 63) - 1];
          const own = ((code >> 6) & 1) === ctx.color;
          if ((ef.side === 1 && own) || (ef.side === 2 && !own)) continue;
          if (ef.sparePawns && T2.pawn) continue;
          if (ef.spareRoyal && T2.royal) continue;
          hit.push(sq);
        }
      }
      if (log) log.push({ type: 'explode', sq: ctx.to, radius: r });
      hit.forEach((sq) => removeAt(N, sq, log, 'explode'));
      if (ef.self && ctx.sq === ctx.to) {
        removeAt(N, ctx.sq, log, 'explode');
        ctx.sq = -1;
      }
      break;
    }
    case 'removeSelf':
      if (ctx.sq >= 0) {
        removeAt(N, ctx.sq, log, 'self');
        ctx.sq = -1;
      }
      break;
    case 'leaveBehind':
      if (N.b[ctx.from] === 0) {
        N.b[ctx.from] = mk(ef.t, ctx.color, 1);
        N.tf[ctx.from] = 0;
        if (log) log.push({ type: 'spawn', sq: ctx.from, t: ef.t });
      }
      break;
    case 'recruit':
      if (ctx.capType >= 0 && !G.types[ctx.capType].royal && N.b[ctx.from] === 0) {
        N.b[ctx.from] = mk(ctx.capType, ctx.color, 1);
        N.tf[ctx.from] = 0;
        if (log) log.push({ type: 'spawn', sq: ctx.from, t: ctx.capType, recruit: true });
      }
      break;
    case 'addTag':
      if (ctx.sq >= 0 && !(N.tg[ctx.sq] & ef.bit)) {
        N.tg[ctx.sq] |= ef.bit;
        if (log) log.push({ type: 'tag', sq: ctx.sq, tag: ef.tag });
      }
      break;
    case 'removeTag':
      if (ctx.sq >= 0 && N.tg[ctx.sq] & ef.bit) {
        N.tg[ctx.sq] &= ~ef.bit;
        if (log) log.push({ type: 'untag', sq: ctx.sq, tag: ef.tag });
      }
      break;
    case 'win':
      ctx.win = true;
      break;
    case 'lose':
      ctx.lose = true;
      break;
    default:
      break;
  }
}

function countPieces(G, S, color) {
  let n = 0;
  for (let sq = 0; sq < G.N; sq++) {
    const code = S.b[sq];
    if (code && ((code >> 6) & 1) === color) n++;
  }
  return n;
}

// Aplica o lance m ao estado S e devolve um novo estado.
// log = true registra os eventos (capturas, transformações...) em N.ev para a interface.
function applyMove(G, S, m, log = false) {
  const N = cloneState(G, S);
  const ev = log ? [] : null;
  N.ev = ev;
  const flag = (m >> 22) & 3;
  const me = S.turn;
  N.ex = null;
  if (flag === F_PASS) {
    N.turn = 1 - me;
    N.ply = S.ply + 1;
    if (ev) ev.push({ type: 'pass' });
    endTurnFor(G, N, me, ev);
    N.hash = computeHash(G, N);
    return N;
  }
  const from = m & 255;
  const to = (m >> 8) & 255;
  const promo = ((m >> 16) & 63) - 1;
  const b = N.b;
  const code = b[from];
  const moverType = (code & 63) - 1;
  const T = G.types[moverType];
  let capType = -1;
  let capSq = -1;

  if (flag === F_EP) {
    capSq = S.epV;
    capType = (b[capSq] & 63) - 1;
    if (ev) ev.push({ type: 'capture', sq: capSq, code: b[capSq] });
    b[capSq] = 0;
    N.tg[capSq] = 0;
    N.tf[capSq] = 0;
  } else if (b[to] !== 0) {
    capSq = to;
    capType = (b[to] & 63) - 1;
    if (ev) ev.push({ type: 'capture', sq: to, code: b[to] });
  }

  const tagsMoving = G.usesTags ? N.tg[from] : 0;
  b[to] = code | MOVED;
  b[from] = 0;
  if (G.usesTags) {
    N.tg[to] = tagsMoving;
    N.tg[from] = 0;
  }
  const prevTf = G.usesTransform ? N.tf[from] : 0;
  const prevBack = (prevTf >> 6) & 3;
  if (G.usesTransform) {
    N.tf[to] = N.tf[from];
    N.tf[from] = 0;

      if (!v || v === p.id) {
        letterIn.value = p.id;
        return;
      }
      if (r.pieces.some((q) => q !== p && q.id === v)) {
        toast(`A letra ${v} já é usada por ${nameOf(r, v)}.`, { kind: 'warn' });
        letterIn.value = p.id;
        return;
      }
      renamePieceId(r, p.id, v);
      commit();
    });

    const auto = p.value === null;
    const autoVal = pieceAutoValue(p, W, H);
    const valIn = h('input', { class: 'inp inp-num', id: 'pc-value', type: 'number', min: 0, max: 20000, step: 10, value: auto ? autoVal : p.value, disabled: auto });
    valIn.addEventListener('change', () => {
      p.value = Math.max(0, Math.min(20000, Math.round(Number(valIn.value) || 0)));
      commit({ rerender: false });
    });
    const autoIn = h('input', { type: 'checkbox', id: 'pc-auto' });
    autoIn.checked = auto;
    autoIn.addEventListener('change', () => {
      p.value = autoIn.checked ? null : autoVal;
      commit();
    });

    const ident = h(
      'div',
      { class: 'pc-ident' },
      iconBtn,
      h('div', { class: 'field' }, h('label', { for: 'pc-name' }, 'Nome'), nameIn),
      h('div', { class: 'field field-xs' }, h('label', { for: 'pc-letter' }, 'Letra'), letterIn),
      h(
        'div',
        { class: 'field field-sm' },
        h('label', { for: 'pc-value' }, 'Valor para o robô'),
        valIn,
        h('label', { class: 'mini-check', for: 'pc-auto' }, autoIn, h('span', null, 'Calcular sozinho')),
      ),
    );

    // --- movimentos
    if (E.setIdx >= p.moves.length) E.setIdx = 0;
    const set = p.moves[E.setIdx];
    const setTabs = h('div', { class: 'set-tabs', role: 'tablist', 'aria-label': 'Grupos de movimentos' });
    p.moves.forEach((s, i) => {
      const b = h('button', {
        type: 'button',
        role: 'tab',
        'aria-selected': i === E.setIdx ? 'true' : 'false',
        class: `set-tab ${i === E.setIdx ? 'on' : ''} ${s.when !== 'always' ? 'cond' : ''}`,
        onclick: () => {
          E.setIdx = i;
          renderTab();
        },
      });
      b.textContent = setLabel(r, s);
      setTabs.appendChild(b);
    });
    setTabs.appendChild(
      btn('Movimento sob condição', {
        kind: 'ghost',
        icon: 'plus',
        small: true,
        title: 'Movimentos que só valem em certas situações',
        onClick: () => {
          p.moves.push({ when: 'enemyHalf', steps: [] });
          E.setIdx = p.moves.length - 1;
          commit();
        },
      }),
    );

    const ghost = set.when === 'always' ? [] : p.moves.filter((s) => s.when === 'always').flatMap((s) => s.steps);
    const diagram = moveDiagram({
      steps: set.steps,
      ghost,
      piece: p,
      size: 'lg',
      label: `Movimentos de ${p.name}`,
      onCell: (dx, dy) => {
        set.steps = applyTool(set.steps, dx, dy, toolState);
        commit();
      },
    });

    const tpl = h('div', { class: 'tpl' }, h('span', { class: 'mg-tool-lb' }, 'Somar movimentos prontos'));
    Object.values(MOVE_TEMPLATES).forEach((t) => {
      tpl.appendChild(
        btn(`+ ${t.label}`, {
          kind: 'chip',
          small: true,
          onClick: () => {
            const add = t.steps();
            const key = (s) => `${s.kind}:${s.dx},${s.dy}`;
            const have = new Set(set.steps.map(key));
            set.steps = [...set.steps.filter((s) => !add.some((a) => key(a) === key(s))), ...add];
            if (add.every((a) => have.has(key(a)))) toast('Esses movimentos já estavam lá.');
            commit();
          },
        }),
      );
    });
    tpl.appendChild(
      btn('Igual ao Peão', {
        kind: 'chip',
        small: true,
        title: 'Anda uma casa para frente, duas no primeiro lance e captura na diagonal',
        onClick: async () => {
          if (p.moves.some((s) => s.steps.length) && !(await confirmDialog({ title: 'Usar movimentos do Peão?', text: `Os movimentos atuais de ${p.name} serão trocados pelos do Peão.`, ok: 'Trocar' }))) return;
          p.moves = pawnMoves();
          E.setIdx = 0;
          commit();
        },
      }),
    );
    tpl.appendChild(
      btn('Limpar este grupo', {
        kind: 'chip',
        small: true,
        onClick: () => {
          set.steps = [];
          commit();
        },
      }),
    );

    // salto em L com medidas escolhidas
    const lA = select([1, 2, 3, 4].map((n) => ({ value: n, label: `${n} ${n === 1 ? 'casa' : 'casas'}` })), E.lA || 3, (v) => (E.lA = parseInt(v, 10)), { class: 'sel sel-sm', 'aria-label': 'Anda quantas casas' });
    const lB = select([0, 1, 2, 3, 4].map((n) => ({ value: n, label: n ? `${n} para o lado` : 'nenhuma para o lado' })), E.lB === undefined ? 1 : E.lB, (v) => (E.lB = parseInt(v, 10)), { class: 'sel sel-sm', 'aria-label': 'Vira quantas casas' });
    const addL = (asRide) => {
      const a = E.lA || 3;
      const b = E.lB === undefined ? 1 : E.lB;
      const dirs = lShape(Math.max(a, b), Math.min(a, b));
      const add = asRide ? ride(dirs, 0, toolState.mode) : leap(dirs, toolState.mode);
      const key = (st) => `${st.kind}:${st.dx},${st.dy}`;
      set.steps = [...set.steps.filter((st) => !add.some((x) => key(x) === key(st))), ...add];
      commit();
    };
    const customL = h(
      'div',
      { class: 'tpl tpl-l' },
      h('span', { class: 'mg-tool-lb' }, 'Salto em L sob medida (como o Camelo, que anda 3 e vira 1)'),
      h('span', null, 'Anda'),
      lA,
      h('span', null, 'e vira'),
      lB,
      btn('Somar salto', { kind: 'chip', small: true, onClick: () => addL(false) }),
      btn('Somar em linha', { kind: 'chip', small: true, title: 'Repete o mesmo L várias vezes na mesma direção', onClick: () => addL(true) }),
    );

    const tools = toolPanel(() => {});
    const condBox = set.when !== 'always' ? conditionEditor(p, set) : null;

    const steps = h('details', { class: 'steps-box' }, h('summary', null, `Lista de movimentos deste grupo (${set.steps.length})`));
    steps.appendChild(
      stepList(set.steps, (next) => {
        set.steps = next;
        commit();
      }),
    );
    steps.addEventListener('toggle', () => (E.stepsOpen = steps.open));
    steps.open = !!E.stepsOpen;

    const summary = h('p', { class: 'mg-sum' }, `Resumo: ${stepsSummary(set.steps)}.`);

    const moveBox = h(
      'section',
      { class: 'sheet mv-box', 'aria-label': 'Movimentos' },
      h('div', { class: 'mv-head' }, h('h3', { class: 'h-sec' }, 'Movimentos'), setTabs),
      condBox,
      h(
        'div',
        { class: 'mv-body' },
        h('div', { class: 'mv-grid-col' }, diagram, h('p', { class: 'mg-note', html: `${legendHTML()}` }), h('p', { class: 'mg-note' }, 'Para cima é para frente. As pretas usam o mesmo desenho virado.'), summary),
        h('div', { class: 'mv-tools-col' }, tools, tpl, customL),
      ),
      steps,
    );

    // --- características
    const traits = h('section', { class: 'sheet traits', 'aria-label': 'Características' }, h('h3', { class: 'h-sec' }, 'Características'));
    traits.appendChild(
      toggle('É o Rei', p.royal, (v) => {
        p.royal = v;
        if (v && !r.pieces.some((q) => q !== p && q.castling)) p.castling = p.castling || false;
        commit();
      }, 'Se levar xeque-mate (ou for capturado, conforme a forma de vencer), o jogador perde.'),
    );
    traits.appendChild(
      toggle('Faz roque', p.castling, (v) => {
        p.castling = v;
        commit();
      }, 'Anda duas casas na direção de uma peça de roque que ainda não se moveu, e ela pula para o outro lado.'),
    );
    traits.appendChild(
      toggle('É peça de roque (como a Torre)', p.castleRook, (v) => {
        p.castleRook = v;
        commit();
      }),
    );
    traits.appendChild(
      toggle('Segue a regra do en passant', p.pawn, (v) => {
        p.pawn = v;
        commit();
      }, 'Ao andar duas casas em linha reta, pode ser capturada en passant. Também pode capturar assim.'),
    );

    const promoOn = !!(p.promotion && p.promotion.to.length);
    traits.appendChild(
      toggle('Promove no fim do tabuleiro', promoOn, (v) => {
        p.promotion = v ? { to: r.pieces.filter((q) => q !== p && !q.royal).slice(0, 4).map((q) => q.id), zone: 1 } : null;
        if (v && !p.promotion.to.length) p.promotion = null;
        commit();
      }),
    );
    if (promoOn) {
      const box = h('div', { class: 'promo-box' }, h('p', { class: 'muted' }, 'Pode virar:'));
      const choices = h('div', { class: 'promo-choices' });
      r.pieces
        .filter((q) => q !== p)
        .forEach((q) => {
          const id = `promo-${q.id}`;
          const inp = h('input', { type: 'checkbox', id });
          inp.checked = p.promotion.to.includes(q.id);
          inp.addEventListener('change', () => {
            const set2 = new Set(p.promotion.to);
            if (inp.checked) set2.add(q.id);
            else set2.delete(q.id);
            p.promotion.to = r.pieces.map((x) => x.id).filter((x) => set2.has(x));
            if (!p.promotion.to.length) p.promotion = null;
            commit();
          });
          choices.appendChild(h('label', { class: 'promo-opt', for: id }, inp, h('span', { class: 'pick-ic', html: pieceSVG(q.icon, 0, q.id) }), h('span', null, q.name)));
        });
      box.appendChild(choices);
      box.appendChild(
        h(
          'div',
          { class: 'field-inline' },
          h('label', { for: 'promo-zone' }, 'Onde promove'),
          select(
            [
              { value: 1, label: 'Na última fileira' },
              { value: 2, label: 'Nas 2 últimas fileiras' },
              { value: 3, label: 'Nas 3 últimas fileiras' },
            ],
            p.promotion.zone,
            (v) => {
              p.promotion.zone = parseInt(v, 10);
              commit();
            },
            { id: 'promo-zone' },
          ),
        ),
      );
      traits.appendChild(box);
    }

    const foot = h(
      'div',
      { class: 'pc-foot' },
      btn('Duplicar peça', {
        kind: 'ghost',
        icon: 'copy',
        small: true,
        onClick: () => {
          if (r.pieces.length >= 26) return toast('Use no máximo 26 peças diferentes.');
          const c = clone(p);
          c.id = freeLetter(r, p.name);
          c.name = `${p.name} 2`;
          c.royal = false;
          r.pieces.splice(E.pieceIdx + 1, 0, c);
          E.pieceIdx++;
          commit();
        },
      }),
      btn('Excluir peça', {
        kind: 'danger-ghost',
        icon: 'trash',
        small: true,
        onClick: async () => {
          if (!(await confirmDialog({ title: `Excluir ${p.name}?`, text: 'A peça também sai da posição inicial, das promoções e das regras especiais.', ok: 'Excluir', danger: true }))) return;
          removePieceId(r, p.id);
          E.pieceIdx = Math.max(0, E.pieceIdx - 1);
          commit();
        },
      }),
    );

    return h('div', { class: 'pc-edit' }, h('section', { class: 'sheet' }, ident), moveBox, traits, foot);
  }

  function conditionEditor(p, set) {
    const r = E.rules;
    const box = h('div', { class: 'cond-box' });
    const whenSel = select(WHEN_OPTIONS, set.when, (v) => {
      set.when = v;
      if ((v === 'hasTag' || v === 'noTag') && !set.tag) set.tag = 'marca';
      if (v === 'minRank' && !set.rank) set.rank = Math.ceil(r.board.height / 2) + 1;
      if (v === 'nearFriend' && set.piece === undefined) set.piece = '';
      commit();
    }, { id: 'set-when', 'aria-label': 'Quando vale' });
    const row = h('div', { class: 'cond-row' }, h('label', { for: 'set-when' }, 'Este grupo vale'), whenSel);
    if (set.when === 'hasTag' || set.when === 'noTag') {
      const tagIn = h('input', { class: 'inp inp-tag', value: set.tag || '', maxlength: 24, 'aria-label': 'Nome da marca' });
      tagIn.addEventListener('change', () => {
        set.tag = tagIn.value.trim().toLowerCase() || 'marca';
        commit();
      });
      row.append(h('span', null, 'marca'), tagIn);
    }
    if (set.when === 'minRank') {
      row.append(
        select(
          Array.from({ length: r.board.height }, (_, i) => ({ value: i + 1, label: `fileira ${i + 1}` })),
          set.rank,
          (v) => {
            set.rank = parseInt(v, 10);
            commit();
          },
          { 'aria-label': 'Fileira' },
        ),
      );
    }
    if (set.when === 'nearFriend') {
      row.append(
        select([{ value: '', label: 'qualquer peça' }, ...r.pieces.map((q) => ({ value: q.id, label: q.name }))], set.piece || '', (v) => {
          set.piece = v;
          commit();
        }, { 'aria-label': 'Peça aliada' }),
      );
    }
    box.append(
      row,
      toggle('Substitui os movimentos de sempre', !!set.replace, (v) => {
        set.replace = v;
        commit();
      }, set.replace ? 'Quando a condição vale, a peça anda só como este grupo.' : 'Desligado: estes movimentos se somam aos de sempre.'),
      btn('Excluir este grupo', {
        kind: 'danger-ghost',
        icon: 'trash',
        small: true,
        onClick: () => {
          p.moves.splice(E.setIdx, 1);
          E.setIdx = 0;
          commit();
        },
      }),
    );
    return box;
  }

  function pickIcon(p) {
    const body = h('div', { class: 'icon-groups' });
    let dlg;
    ICON_GROUPS.forEach((g) => {
      const grid = h('div', { class: 'icon-grid' });
      body.append(h('h3', { class: 'h-sec icon-group-h' }, g.label), grid);
      ICON_KEYS.filter((k) => iconGroup(k) === g.id).forEach((k) => addOpt(grid, k));
    });
    function addOpt(grid, k) {
      const b = h('button', {
        type: 'button',
        class: `icon-opt ${p.icon === k ? 'on' : ''}`,
        'aria-label': ICONS[k].label,
        onclick: () => {
          p.icon = k;
          dlg.close();
          commit();
        },
      });
      b.innerHTML = `<span class="io-pcs">${pieceSVG(k, 0, p.id)}${pieceSVG(k, 1, p.id)}</span><span>${ICONS[k].label}</span>`;
      grid.appendChild(b);
    }
    dlg = modal({ title: `Desenho de ${p.name}`, body, wide: true });
  }

  // =========================================================================
  // Regras especiais
  // =========================================================================

  function pieceOptions() {
    return E.rules.pieces.map((q) => ({ value: q.id, label: q.name, html: pieceSVG(q.icon, 0, q.id) }));
  }

  function renderTriggers() {
    const r = E.rules;
    const wrap = h('div', { class: 'trg-tab' });
    wrap.appendChild(
      h(
        'div',
        { class: 'sheet trg-intro' },
        h('p', null, 'Uma regra especial diz o que acontece depois de um lance. Por exemplo: quando uma peça captura, ela vira a peça capturada.'),
        h(
          'div',
          { class: 'tpl' },
          h('span', { class: 'mg-tool-lb' }, 'Começar de um exemplo'),
          ...TRIGGER_EXAMPLES.map((ex) =>
            btn(ex.label, {
              kind: 'chip',
              small: true,
              title: ex.hint,
              onClick: () => {
                const royal = r.pieces.filter((q) => q.royal).map((q) => q.id);
                const pawn = r.pieces.find((q) => q.pawn);
                const strongest = r.pieces.filter((q) => !q.royal).sort((a, b) => (b.value || 0) - (a.value || 0))[0];
                const ids = { nonRoyal: royal.length ? r.pieces.filter((q) => !q.royal).map((q) => q.id) : [], pawn: pawn && pawn.id, strongest: strongest && strongest.id, any: r.pieces[0] && r.pieces[0].id };
                r.triggers.push(normalizeRules({ ...r, triggers: [ex.make(ids)] }).triggers[0]);
                commit();
                toast(`Regra "${ex.label}" adicionada no fim da lista.`);
              },
            }),
          ),
        ),
      ),
    );
    if (!r.triggers.length) wrap.appendChild(h('p', { class: 'empty-note' }, 'Nenhuma regra especial ainda. Use um exemplo acima ou crie uma do zero.'));
    r.triggers.forEach((t, i) => wrap.appendChild(triggerCard(t, i)));
    wrap.appendChild(
      btn('Nova regra especial', {
        kind: 'ghost',
        icon: 'plus',
        onClick: () => {
          r.triggers.push({ event: 'capture', pieces: [], targets: [], conditions: [], effects: [{ type: 'becomeCaptured' }], enabled: true });
          commit();
        },
      }),
    );
    return wrap;
  }

  function triggerCard(t, i) {
    const r = E.rules;
    const preview = h('p', { class: 'rule-text' }, triggerSentence(r, t));
    const soft = () => {
      commit({ rerender: false });
      preview.textContent = triggerSentence(r, t);
    };

    const head = h(
      'div',
      { class: 'rc-head' },
      h('h3', { class: 'h-sec' }, `Regra especial ${i + 1}`),
      toggle('Ativa', t.enabled, (v) => {
        t.enabled = v;
        commit();
      }),
      h(
        'div',
        { class: 'rc-tools' },
        iconButton('copy', 'Duplicar regra', () => {
          r.triggers.splice(i + 1, 0, clone(t));
          commit();
        }),
        iconButton('trash', 'Excluir regra', async () => {
          if (!(await confirmDialog({ title: 'Excluir esta regra especial?', text: triggerSentence(r, t), ok: 'Excluir', danger: true }))) return;
          r.triggers.splice(i, 1);
          commit();
        }),
      ),
    );

    // Quando ...
    const when = h(
      'div',
      { class: 'rc-row' },
      h('span', { class: 'rc-kw' }, 'Quando'),
      multiPick({
        options: pieceOptions(),
        value: t.pieces,
        label: 'Qual peça',
        onChange: (v) => {
          t.pieces = v;
          soft();
        },
      }),
      select(EVENT_OPTIONS, t.event, (v) => {
        t.event = v;
        if (v !== 'capture') {
          t.targets = [];
          t.effects = t.effects.filter((e) => e.type !== 'becomeCaptured' && e.type !== 'recruit');
        }
        commit();
      }, { 'aria-label': 'O que acontece' }),
    );
    if (t.event === 'capture') {
      when.appendChild(
        multiPick({
          options: pieceOptions(),
          value: t.targets,
          label: 'Qual peça é capturada',
          onChange: (v) => {
            t.targets = v;
            soft();
          },
        }),
      );
    }

    // e se ...
    const conds = h('div', { class: 'rc-row rc-list' }, h('span', { class: 'rc-kw' }, 'e se'));
    t.conditions.forEach((c, ci) => {
      const chip = h('span', { class: 'rc-chip' }, h('span', null, (COND_OPTIONS.find((o) => o.value === c.type) || {}).label || c.type));
      if (c.type === 'hasTag' || c.type === 'noTag') {
        const inp = h('input', { class: 'inp inp-tag', value: c.tag || '', maxlength: 24, 'aria-label': 'Nome da marca' });
        inp.addEventListener('input', () => {
          c.tag = inp.value.trim().toLowerCase() || 'marca';
          soft();
        });
        chip.appendChild(inp);
      }
      if (c.type === 'minRank') {
        chip.appendChild(
          select(Array.from({ length: r.board.height }, (_, k) => ({ value: k + 1, label: `fileira ${k + 1}` })), c.rank, (v) => {
            c.rank = parseInt(v, 10);
            soft();
          }, { class: 'sel sel-sm', 'aria-label': 'Fileira' }),
        );
      }
      chip.appendChild(
        iconButton('close', 'Tirar condição', () => {
          t.conditions.splice(ci, 1);
          commit();
        }),
      );
      conds.appendChild(chip);
    });
    const avail = COND_OPTIONS.filter((o) => (t.event === 'capture' || (o.value !== 'targetStronger' && o.value !== 'targetWeaker')) && !t.conditions.some((c) => c.type === o.value));
    conds.appendChild(
      addSelect('+ condição', avail, (v) => {
        const c = { type: v };
        if (v === 'hasTag' || v === 'noTag') c.tag = 'marca';
        if (v === 'minRank') c.rank = r.board.height;
        t.conditions.push(c);
        commit();
      }),
    );
    if (!t.conditions.length) conds.appendChild(h('span', { class: 'muted rc-none' }, 'sempre'));

    // então ...
    const effs = h('div', { class: 'rc-effects' }, h('span', { class: 'rc-kw' }, 'então'));
    t.effects.forEach((e, ei) => effs.appendChild(effectRow(t, e, ei, soft)));
    const effAvail = EFFECT_OPTIONS.filter((o) => t.event === 'capture' || (o.value !== 'becomeCaptured' && o.value !== 'recruit'));
    effs.appendChild(
      addSelect('+ efeito', effAvail, (v) => {
        const e = { type: v };
        if (v === 'become' || v === 'leaveBehind') e.piece = (r.pieces.find((q) => !q.royal) || r.pieces[0]).id;
        if (v === 'extraMove') Object.assign(e, { same: true, capture: 'any', optional: true });
        if (v === 'explode') Object.assign(e, { radius: 1, self: true, sparePawns: true, spareRoyal: false });
        if (v === 'addTag' || v === 'removeTag') e.tag = 'marca';
        t.effects.push(e);
        commit();
      }),
    );

    return h('article', { class: `sheet rule-card ${t.enabled ? '' : 'off'}` }, head, when, conds, effs, preview);
  }

  function effectRow(t, e, ei, soft) {
    const r = E.rules;
    const row = h('div', { class: 'eff' }, h('span', { class: 'eff-t' }, (EFFECT_OPTIONS.find((o) => o.value === e.type) || {}).label || e.type));
    const pieceSel = (key) =>
      select(r.pieces.map((q) => ({ value: q.id, label: q.name })), e[key], (v) => {
        e[key] = v;
        soft();
      }, { class: 'sel sel-sm', 'aria-label': 'Peça' });
    if (e.type === 'become' || e.type === 'leaveBehind') row.appendChild(pieceSel('piece'));
    if (e.type === 'become' || e.type === 'becomeCaptured') {
      const turnsSel = select(
        Array.from({ length: 10 }, (_, k) => ({ value: k + 1, label: `${k + 1} ${k ? 'lances' : 'lance'}` })),
        e.turns || 2,

  const p = PRESETS.find((x) => x.id === id) || PRESETS[0];
  const r = clone(p);
  delete r.id;
  r.name = `${p.name} (minha versão)`.slice(0, 60);
  const item = library.add(r, { origin: `preset:${id}` });
  navigate('editor', { uid: item.uid, skipWarn: true });
  toast('Pronto para editar. As mudanças ficam neste navegador até você baixar o arquivo.', { timeout: 5500 });
};

app.newBlank = () => {
  const r = normalizeRules({
    name: 'Nova variante',
    description: '',
    board: { width: 8, height: 8 },
    pieces: classicPieces(),
    setup: '4r3/8/8/8/8/8/8/4R3',
  });
  const item = library.add(r, { origin: 'new' });
  navigate('editor', { uid: item.uid, tab: 'setup', skipWarn: true });
  toast('Tabuleiro só com os Reis. Coloque as peças na aba Posição inicial.', { timeout: 5000 });
};

app.pickFile = (cb) => {
  const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
  inp.addEventListener('change', () => {
    if (inp.files && inp.files[0]) cb(inp.files[0]);
    inp.remove();
  });
  document.body.appendChild(inp);
  inp.click();
};

async function importFile(file) {
  try {
    const { rules, problem } = parseRulesText(await readFile(file));
    const item = library.add(rules, { origin: 'file', saved: true });
    navigate('editor', { uid: item.uid, skipWarn: true });
    toast(problem ? `Arquivo aberto, mas falta corrigir: ${problem}` : `"${rules.name}" aberta.`, { kind: problem ? 'warn' : 'info', timeout: 5000 });
  } catch (e) {
    toast(e.message, { kind: 'warn', timeout: 5000 });
  }
}
app.openFile = () => app.pickFile(importFile);

app.edit = (uid) => navigate('editor', { uid });

app.editSource = async (source, rules) => {
  if (source && source.kind === 'mine' && library.get(source.id)) {
    navigate('editor', { uid: source.id });
    return;
  }
  const ok = await confirmDialog({ title: 'Editar uma cópia?', text: 'As variantes prontas não mudam. Vou criar uma cópia sua para editar.', ok: 'Criar cópia' });
  if (!ok) return;
  const r = clone(rules);
  r.name = `${r.name} (minha versão)`.slice(0, 60);
  const item = library.add(r, { origin: 'copy' });
  navigate('editor', { uid: item.uid, skipWarn: true });
};

app.playItem = (uid) => {
  const item = library.get(uid);
  if (!item) return;
  const go = () => app.newGameDialog({ source: { kind: 'mine', id: uid }, rules: item.rules, name: item.rules.name });
  if (current === 'editor') warnUnsaved(uid, go);
  else go();
};

app.playPreset = (id) => {
  const p = PRESETS.find((x) => x.id === id);
  if (p) app.newGameDialog({ source: { kind: 'preset', id }, rules: p, name: p.name });
};

app.newGameDialog = ({ source, rules, name }) => {
  const s = settings.data;
  const opts = { mode: s.mode || 'ai', side: s.side || 'white', level: s.level || 'medium' };
  const sideRow = h('div', { class: 'field-block' }, h('span', { class: 'mg-tool-lb' }, 'Suas peças'), segmented(
    [
      { value: 'white', label: 'Brancas' },
      { value: 'black', label: 'Pretas' },
      { value: 'random', label: 'Sorteio' },
    ],
    opts.side,
    (v) => (opts.side = v),
    { label: 'Suas peças' },
  ));
  const levelRow = h('div', { class: 'field-block' }, h('span', { class: 'mg-tool-lb' }, 'Nível do robô'), segmented(
    [
      { value: 'easy', label: 'Fácil' },
      { value: 'medium', label: 'Médio' },
      { value: 'hard', label: 'Difícil' },
    ],
    opts.level,
    (v) => (opts.level = v),
    { label: 'Nível do robô' },
  ));
  const sync = () => {
    sideRow.hidden = opts.mode !== 'ai';
    levelRow.hidden = opts.mode === 'local';
  };
  const modeRow = h('div', { class: 'field-block' }, h('span', { class: 'mg-tool-lb' }, 'Quem joga'), segmented(
    [
      { value: 'ai', label: 'Contra o robô', icon: 'robot' },
      { value: 'local', label: 'Duas pessoas', icon: 'people' },
      { value: 'auto', label: 'Robô contra robô', icon: 'robot' },
    ],
    opts.mode,
    (v) => {
      opts.mode = v;
      sync();
    },
    { label: 'Quem joga' },
  ));
  sync();
  modal({
    title: `Jogar: ${name || rules.name}`,
    body: h('div', { class: 'newgame' }, modeRow, sideRow, levelRow),
    actions: [
      { label: 'Cancelar', kind: 'ghost' },
      {
        label: 'Começar partida',
        kind: 'primary',
        icon: 'play',
        onClick: () => {
          sound.unlock();
          settings.set({ mode: opts.mode, side: opts.side, level: opts.level });
          const human = opts.side === 'random' ? (Math.random() < 0.5 ? 0 : 1) : opts.side === 'black' ? 1 : 0;
          const ok = views.play.start({ source, rules: clone(rules), name: name || rules.name, mode: opts.mode, human, level: opts.level });
          if (!ok) return false;
          navigate('play', { skipWarn: true });
          return true;
        },
      },
    ],
  });
};

function openSettings() {
  const s = settings.data;
  const body = h(
    'div',
    { class: 'settings' },
    h('div', { class: 'field-block' }, h('span', { class: 'mg-tool-lb' }, 'Tema'), segmented(
      [
        { value: 'auto', label: 'Automático' },
        { value: 'light', label: 'Claro' },
        { value: 'dark', label: 'Escuro' },
        { value: 'turbo', label: 'Turbo' },
      ],
      s.theme,
      (v) => {
        settings.set({ theme: v });
        applyTheme();
      },
      { label: 'Tema' },
    )),
    h('div', { class: 'field-block' }, h('span', { class: 'mg-tool-lb' }, 'Cores do tabuleiro'), segmented(
      [
        { value: 'tinta', label: 'Tinta', swatch: 'bsw bsw-tinta' },
        { value: 'madeira', label: 'Madeira', swatch: 'bsw bsw-madeira' },
        { value: 'verde', label: 'Verde', swatch: 'bsw bsw-verde' },
        { value: 'marmore', label: 'Mármore', swatch: 'bsw bsw-marmore' },
      ],
      s.board,
      (v) => {
        settings.set({ board: v });
        applyBoardTheme();
      },
      { label: 'Cores do tabuleiro' },
    )),
    toggle('Mostrar coordenadas (a–h, 1–8)', s.coords, (v) => {
      settings.set({ coords: v });
      views.play.refreshSettings();
    }),
    toggle('Sons', s.sound, (v) => {
      settings.set({ sound: v });
      setSound(v);
    }),
    !storageWorks() ? h('p', { class: 'prob' }, 'Este navegador não está guardando dados desta página. Baixe suas regras sempre que terminar de editar.') : null,
  );
  modal({ title: 'Ajustes', body, actions: [{ label: 'Pronto', kind: 'primary' }] });
}

// ---------------------------------------------------------------------------
// Início
// ---------------------------------------------------------------------------

async function handleShareLink() {
  const m = /^#v=([A-Za-z0-9_-]+)$/.exec(location.hash);
  if (!m) return;
  try {
    const { rules, problem } = await decodeShare(m[1]);
    history.replaceState(null, '', location.pathname + location.search);
    const item = library.add(rules, { origin: 'link' });
    views.library.render();
    modal({
      title: `Você recebeu: ${rules.name}`,
      body: h('p', { class: 'dlg-text' }, `${rules.description || 'Uma variante de xadrez.'} ${problem ? `Atenção: ${problem}` : ''} A variante foi guardada neste navegador. Baixe o arquivo se quiser manter uma cópia.`),
      actions: [
        { label: 'Ver as regras', kind: 'ghost', onClick: () => navigate('editor', { uid: item.uid, skipWarn: true }) },
        { label: 'Jogar agora', kind: 'primary', icon: 'play', onClick: () => app.playItem(item.uid) },
      ],
    });
  } catch (e) {
    toast(`Não foi possível abrir o link: ${e.message}`, { kind: 'warn', timeout: 6000 });
  }
}

function init() {
  settings.load();
  library.load();
  setSound(settings.data.sound);
  buildShell();
  applyTheme();
  applyBoardTheme();
  if (media && media.addEventListener) media.addEventListener('change', applyTheme);

  views.library = createLibrary(app);
  views.editor = createEditor(app);
  views.play = createPlay(app);

  navigate('library', { skipWarn: true });
  handleShareLink();

  // arrastar arquivo para a página
  window.addEventListener('dragover', (e) => {
    if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) {
      e.preventDefault();
      document.body.classList.add('dropping');
    }
  });
  window.addEventListener('dragleave', (e) => {
    if (!e.relatedTarget) document.body.classList.remove('dropping');
  });
  window.addEventListener('drop', (e) => {
    document.body.classList.remove('dropping');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    importFile(f);
  });

  // aviso do navegador ao fechar com regras não baixadas
  window.addEventListener('beforeunload', (e) => {
    if (library.anyDirty()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  setInterval(reminderTick, 60 * 1000);
  setTimeout(warmDownloads, 0);
  setTimeout(() => {
    if (!storageWorks()) toast('Este navegador não está guardando dados. Baixe suas regras sempre que terminar.', { kind: 'warn', timeout: 8000 });
  }, 800);

  if ('serviceWorker' in navigator && !IS_STANDALONE && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}

init();

return {  };
})();
